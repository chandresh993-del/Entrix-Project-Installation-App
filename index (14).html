<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F44">
<title>Entrix Installation App</title>
<meta name="application-name" content="Entrix Installation App">
<meta name="apple-mobile-web-app-title" content="Entrix Installation">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --navy:#0A1F44; --amber:#F2A900; --amber-dim:#C88C05;
  --paper:#F4F6F9; --card:#fff; --ink:#16202E; --muted:#6B7789; --line:#DDE3EC;
  --green:#1B7F5A; --red:#C0392B; --blue:#2F6FDE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.45;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none;color:inherit}

header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;letter-spacing:.16em;font-size:13px}
.brand span{color:var(--amber)}
header .sub{font-size:11px;color:#9FB0CC;letter-spacing:.04em;margin-top:1px}
.whoami{margin-left:auto;text-align:right;font-size:11px;color:#9FB0CC}
.whoami b{display:block;color:#fff;font-size:12px}
.sync{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4B5C78;margin-right:5px;vertical-align:middle}
.sync.on{background:#3ED598}.sync.off{background:var(--amber)}

main{padding:14px 14px 24px;max-width:680px;margin:0 auto}
.view{display:none}.view.active{display:block}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:10px 4px 11px;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
nav button .ic{display:block;font-size:20px;line-height:1.25;font-weight:400}
nav button.on{color:var(--navy)}nav button.on .ic{color:var(--amber)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 2px 8px}
.eyebrow:first-child{margin-top:0}
label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 5px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(10,31,68,.09)}
.field{margin-bottom:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rupee{position:relative}.rupee .c{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.rupee input{padding-left:30px;font-weight:800}
.btn{display:block;width:100%;padding:14px;border-radius:10px;background:var(--amber);color:#241900;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.btn:active{background:var(--amber-dim)}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.danger{background:#fff;border:1px solid #EBC3BE;color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn.sm{padding:10px;font-size:12px}
.btn:disabled{opacity:.5}
.mini{width:auto;display:inline-block;padding:8px 13px;font-size:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}

/* dashboard */
.grand{background:var(--navy);color:#fff;border-radius:14px;padding:18px;margin-bottom:12px}
.grand.win{background:linear-gradient(135deg,#0A1F44,#14472F)}
.grand.lose{background:linear-gradient(135deg,#0A1F44,#4A1E1A)}
.grand .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9FB0CC;font-weight:700}
.grand .v{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.grand .v.g{color:#3ED598}.grand .v.r{color:#FF8A7A}
.grand .split{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:12px 16px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;color:#C9D6EA}
.grand .split b{display:block;color:#fff;font-size:16px;font-weight:800;margin-top:1px}

/* tools */
.tools{display:flex;gap:8px;margin:2px 0 12px;align-items:center}
.tools input{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border:1.5px solid var(--line);border-radius:99px;background:#fff;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* sites */
.site{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:11px;width:100%;text-align:left;display:block}
.site:active{background:#FAFBFD}
.site .top{display:flex;gap:8px;align-items:flex-start}
.site h3{margin:0;font-size:16px;font-weight:800;flex:1}
.site .meta{font-size:12px;color:var(--muted);margin-top:3px}
.badge{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#E6F4EE;color:var(--green);white-space:nowrap}
.badge.done{background:#E9ECF2;color:var(--muted)}
.figs{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:10px}
.figs .big{font-size:20px;font-weight:800}
.figs small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.pos{color:var(--green)}.neg{color:var(--red)}
.bar{height:7px;background:#E6EAF1;border-radius:99px;overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .3s}
.bar.full i{background:var(--green)}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;margin-top:5px}

.tot{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.tot:last-child{border-bottom:none}
.tot b{font-weight:800;white-space:nowrap}
.tot.h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;padding-top:0}
.tot.key{background:#F7F9FC;margin:2px -15px -15px;padding:12px 17px;border-radius:0 0 12px 12px;border-bottom:none}

.cat{display:grid;grid-template-columns:96px 1fr auto;gap:9px;align-items:center;font-size:12.5px;padding:5px 0}
.cat .b{height:8px;background:#E6EAF1;border-radius:99px;overflow:hidden}
.cat .b i{display:block;height:100%;border-radius:99px}

/* ledger */
.ent{display:flex;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.ent:last-child{border-bottom:none}
.ent .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.ent .body{flex:1;min-width:0}
.ent .t1{font-weight:700;font-size:14px}
.ent .t2{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-word}
.ent .amt{font-weight:800;white-space:nowrap}
.ent .del{color:var(--red);font-size:11px;font-weight:700;margin-top:5px}
.ent .del.armed{background:var(--red);color:#fff;padding:2px 7px;border-radius:5px}

.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
.hint{font-size:12px;color:var(--muted);background:#F0F4FB;border:1px solid #DCE5F3;border-radius:8px;padding:10px 12px;margin-top:12px;line-height:1.5}
.hint b{color:var(--navy)}
.banner{background:#FFF6E0;border:1px solid #F0DCA8;color:#6B5310;font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:12px}

.seg{display:grid;gap:6px;margin-bottom:14px}
.seg button{padding:13px 6px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-weight:800;font-size:13px;transition:.12s}
.seg button:active{transform:scale(.98)}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 2px 8px rgba(10,31,68,.22)}

.sw{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-weight:600;margin:0 0 10px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:40px;height:23px;border-radius:99px;background:#C9D1DD;position:relative;flex:none;transition:.15s}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{left:20px}
.sw input:focus-visible+i{outline:2px solid var(--amber);outline-offset:2px}
#gate .gin{font-size:17px;letter-spacing:normal;text-align:left;font-weight:600;padding:14px;margin-bottom:10px}
#gate .eye{position:absolute;right:8px;top:7px;padding:8px 10px;color:#9FB0CC;font-size:12px;font-weight:700}
#gate .keep{display:flex;align-items:center;gap:8px;color:#9FB0CC;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;margin:2px 0 0;cursor:pointer;text-align:left}
#gate .keep input{width:18px;height:18px;padding:0;margin:0;accent-color:var(--amber)}
.person{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.wa{background:#25D366;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;padding:12px 14px;border-radius:10px}
.wa:active{background:#1DA851}
.sharebar{display:flex;align-items:center;gap:8px;background:#E8F8EE;border:1px solid #BFE9CF;border-radius:10px;padding:8px 8px 8px 12px;margin-bottom:10px;font-size:13px;font-weight:700;color:#14613A}
.sharebar span{flex:1}.sharebar .wa{padding:9px 11px;font-size:12px}.sharebar .x{color:#5E7A69;padding:6px 8px;font-size:16px}
.wbar .barlbl{margin:9px 0 4px}.wbar .bar{margin-top:0}
.wcard .wh,.wedit .wh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wcard .wh b{display:block;font-size:15.5px}.wcard .wh span{font-size:12.5px;color:var(--muted)}
.wcard{border-left:4px solid var(--amber)}
.badge.rate{background:#EEF2F8;color:var(--navy);letter-spacing:.02em;text-transform:none;font-size:11px}
.wedit{border-left:4px solid var(--navy)}
.whint{font-size:12px;color:var(--green);font-weight:700;margin-top:-4px}
.pdfstat{font-size:13px;font-weight:700;color:var(--muted);background:#F4F6F9;border-radius:10px;padding:12px;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.pdfstat.ok{color:var(--green);background:#E8F8EE}.pdfstat.bad{color:var(--red);background:#FBECEA}
.spin{width:15px;height:15px;border:2.5px solid #C9D1DD;border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.wa:disabled{opacity:.45}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid button{aspect-ratio:1;border-radius:8px;overflow:hidden;background:#E6EAF1;padding:0}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
#viewer{position:fixed;inset:0;z-index:55;background:#050C1C;color:#fff;display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#viewer.open{display:flex}
#viewer .vtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#9FB0CC;font-weight:700}
#viewer .vtop button{font-size:22px;color:#fff;padding:6px 10px}
#viewer .vimg{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
#viewer .vcap{padding:10px 2px;font-size:13px}#viewer .vcap b{display:block}#viewer .vcap span{color:#9FB0CC;font-size:12px}
#viewer .vnav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#viewer .vnav button{padding:12px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:13px}
#viewer .vnav button:disabled{opacity:.3}
#viewer .vnav #vD{background:rgba(192,57,43,.35)}#viewer .vnav #vD.armed{background:var(--red)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;background:var(--amber);color:#241900;
  font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:13px;padding:15px 20px;border-radius:99px;
  box-shadow:0 6px 18px rgba(10,31,68,.3);display:none}
.fab.show{display:block}
.fab:active{background:var(--amber-dim)}

#sheet{position:fixed;inset:0;z-index:45;background:rgba(10,31,68,.55);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheetBody{background:#fff;width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h b{font-size:16px}
.sheet-h button{font-size:20px;color:var(--muted);padding:4px 8px}

.tblwrap{overflow-x:auto;margin:0 -4px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
table.t th{background:var(--navy);color:#fff;text-align:right;padding:7px 8px;font-size:11px;letter-spacing:.04em;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t tr.tf td{font-weight:800;border-top:1.5px solid var(--navy);border-bottom:none}

#gate{position:fixed;inset:0;background:var(--navy);z-index:50;display:flex;align-items:center;justify-content:center;padding:26px;overflow:auto}
#gate .box{width:100%;max-width:360px;text-align:center}
#gate .logo{font-weight:800;letter-spacing:.2em;color:#fff;font-size:18px}#gate .logo span{color:var(--amber)}
#gate .tag{color:#8C9BB5;font-size:13px;margin:6px 0 26px}
#gate input{text-align:center;font-size:28px;letter-spacing:.5em;font-weight:800;padding:15px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff}
#gate .err{color:var(--amber);font-size:12.5px;height:18px;margin:10px 0}
#gate .who{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:16px;margin-bottom:12px}
#gate .who:active{background:rgba(255,255,255,.1)}
#gate .who .ic{font-size:25px;width:32px;text-align:center;flex:none}
#gate .who b{display:block;color:#fff;font-size:16px}
#gate .who span{display:block;color:#8C9BB5;font-size:12px;margin-top:2px}
#gate .who .ch{margin-left:auto;color:#5E6E8C;font-size:20px}
#gate .foot{color:#6E7E9C;font-size:11px;margin-top:16px}
#gate .back{color:#8C9BB5;font-size:13px;font-weight:700;margin-bottom:16px;display:inline-block}

.toast{position:fixed;left:14px;right:14px;bottom:calc(82px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:13px 15px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}.toast.bad{background:var(--red)}
@media print{ header,nav,main,.toast,.fab,#sheet,#viewer,#gate{display:none!important} #report{display:block!important;padding:6mm} @page{size:A4;margin:14mm} body{background:#fff} }
#report{display:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>

<div id="gate"><div class="box" id="gateBox"></div></div>

<header>
  <div>
    <div class="brand">ENT<span>R</span>IX</div>
    <div class="sub">Installation App · <span id="verTag">v</span></div>
  </div>
  <div class="whoami"><b id="whoName">—</b><span><i class="sync" id="syncDot"></i><span id="syncTxt">…</span></span></div>
</header>

<main>
  <section class="view active" id="v-sites">
    <div id="cfgBanner"></div>
    <div id="dash"></div>
    <div class="tools"><input id="q" type="search" placeholder="Search site, client, contractor"></div>
    <div class="chips" id="chips" style="margin-bottom:12px"></div>
    <div id="siteList"></div>
    <div id="ownerAdd"></div>
  </section>

  <section class="view" id="v-detail">
    <button class="btn ghost sm mini" id="backBtn" style="margin-bottom:12px">← All sites</button>
    <div id="detailHead"></div>
    <div class="eyebrow">Site photos</div>
    <div class="card" id="photoBox"></div>
    <div class="eyebrow" id="entryHead">Entries</div>
    <div class="chips" id="ledChips" style="margin-bottom:10px"></div>
    <div class="card" id="entryList"></div>
    <div id="reportBtnWrap"></div>
  </section>

  <section class="view" id="v-edit">
    <button class="btn ghost sm mini" id="editBack" style="margin-bottom:12px">← Back</button>
    <div id="editForm"></div>
  </section>

  <section class="view" id="v-reports"></section>
  <section class="view" id="v-people"></section>
</main>

<button class="fab" id="fab">+ Add entry</button>
<div id="sheet"><div id="sheetBody"></div></div>
<div id="viewer" role="dialog" aria-label="Photo"></div>

<nav>
  <button data-go="sites" class="on"><span class="ic">▦</span>Sites</button>
  <button data-go="reports" id="repTab"><span class="ic">📈</span>Reports</button>
  <button data-go="people" id="peopleTab"><span class="ic">👤</span>People</button>
  <button data-go="lock"><span class="ic">⎋</span>Lock</button>
</nav>

<div id="report"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ═══════════ 1. SETTINGS ═══════════ */
const APP_VERSION = '3.2';     // ← bump on every change
const APP_DATE    = '06 Nov 2026';
const ADMIN_ID   = 'admin';   // Admin user ID — change this
const ADMIN_PASS = '1234';    // Admin password — change this

const firebaseConfig = {
  apiKey: "AIzaSyCIoj0grG9a-wwvBQKL6rffl3d4SQHVm5o",
  authDomain: "project-site-expenses.firebaseapp.com",
  projectId: "project-site-expenses",
  storageBucket: "project-site-expenses.firebasestorage.app",
  messagingSenderId: "603747323761",
  appId: "1:603747323761:web:4b1c97f158c2dcd33ab0d0"
};

const CATS = ['Transport','Loading','Unloading','Food','Nashta / tea','Labour','Material','Crane / machinery','Misc'];
const CAT_COL = {'Transport':'#F2A900','Loading':'#2F6FDE','Unloading':'#5B8DEF','Food':'#E2674A','Nashta / tea':'#F28C6B',
  'Labour':'#1B7F5A','Material':'#3FA37A','Crane / machinery':'#8A5CF6','Misc':'#6B7789',
  'Food & stay':'#E2674A','Other':'#6B7789'};
/* entry types: label for admin / for contractor, dot colour */
const TYPE = {
  payment :{a:'Paid to contractor',  c:'Received from company', col:'#F2A900', btn:'Pay contractor'},
  advance :{a:'Advance taken by contractor', c:'Advance taken',  col:'#F2A900', btn:'Advance taken'},
  expense :{a:'Contractor expense',  c:'My expense',            col:'#2F6FDE', btn:'My expense'},
  ourexp  :{a:'Company expense',     c:'Company expense',       col:'#C0392B', btn:'Our expense'},
  received:{a:'Received from client',c:'Received from client',  col:'#1B7F5A', btn:'From client'},
  progress:{a:'Poles installed',     c:'Poles installed',       col:'#0A1F44', btn:'Poles done'}
};

/* ═══════════ 2. Firebase ═══════════ */
let db=null, LIVE=false, SITES=[], PAYS=[], PEOPLE=[], PHOTOS=[], peopleLoaded=false, unPhotos=null;

async function initDB(){
  if(!firebaseConfig.apiKey){ demo(); return; }
  try{
    const [{initializeApp},fs,auth] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js')
    ]);
    const app=initializeApp(firebaseConfig);
    db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});
    window.FS=fs; LIVE=true;
    try{ await auth.signInAnonymously(auth.getAuth(app)); }catch(e){ banner('Enable Anonymous sign-in in Firebase → Authentication.'); }

    /* includeMetadataChanges: without it Firestore never tells us when the server
       has confirmed the phone's copy, so the status got stuck on "offline". */
    const MD={includeMetadataChanges:true};
    const watch=(name,q,apply)=>fs.onSnapshot(q,MD,s=>{
      NET[name]={cache:s.metadata.fromCache,pending:s.metadata.hasPendingWrites};
      if(s.docChanges().length||!NET[name].seen){ NET[name].seen=true; apply(s.docs.map(d=>({id:d.id,...d.data()}))); render(); }
      netStatus();
    }, e=>dbErr(e));
    watch('jobs',fs.query(fs.collection(db,'jobs'),fs.orderBy('name')), l=>{ SITES=l; });
    watch('people',fs.query(fs.collection(db,'people'),fs.orderBy('name')), l=>{ PEOPLE=l; peopleLoaded=true; tryAuto(); checkStillValid(); });
    watch('payments',fs.query(fs.collection(db,'payments'),fs.orderBy('date','desc'),fs.limit(5000)), l=>{ PAYS=l; });
    addEventListener('online',netStatus); addEventListener('offline',netStatus);
  }catch(e){ sync('err'); noConn(); }
}

/* ── Site model ──
   A site has ONE client contract and ONE OR MORE "works", each given to a contractor
   (e.g. Civil foundation → Umesh, Pole erection → Makarand). Old single-contractor
   sites are read as one work with id 'w0', so all old entries keep working. */
const same=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
const CON_TYPES=['payment','advance','expense','progress'];   // entries that belong to one work
const wid=p=>p.workId||'w0';
const newWid=()=>'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const WORKS=['Civil foundation','Pole erection','Transport','Electrical / wiring','Fixture fitting','Painting','Complete installation'];
function worksOf(s){
  if(Array.isArray(s.works)&&s.works.length) return s.works;
  if(s.contractor||s.contractorRate||s.contractorAmount)
    return [{id:'w0',contractor:s.contractor||'',work:'Installation',basis:s.basis==='pole'?'pole':'lump',
      poles:Number(s.poles)||0,rate:Number(s.contractorRate)||0,amount:Number(s.contractorAmount)||0}];
  return [];
}
const siteCons=s=>[...new Set(worksOf(s).map(w=>w.contractor).filter(Boolean))];
const workLabel=w=>[w.work||'Work',w.contractor].filter(Boolean).join(' · ');
function calcWork(w,rows){
  const R=rows.filter(p=>CON_TYPES.includes(p.type)&&wid(p)===w.id);
  const sum=(ty,f='amount')=>R.filter(p=>ty.includes(p.type)).reduce((a,b)=>a+(Number(b[f])||0),0);
  const perPole=w.basis==='pole', poles=Number(w.poles)||0, rate=Number(w.rate)||0;
  const contract=perPole?rate*poles:(Number(w.amount)||0);
  const paid=sum(['payment','advance']), conExp=sum(['expense']), done=sum(['progress'],'qty');
  const earned=perPole?Math.min(done,poles)*rate:contract;
  return {...w,perPole,poles,rate,contract,paid,conExp,done,earned,
    balance:contract-paid, dueNow:earned-paid, conMargin:contract-conExp,
    pct:poles?Math.min(100,Math.round(done/poles*100)):null};
}
/* who = contractor name → only his works · null → all works.
   A signed-in contractor is ALWAYS limited to his own works. */
function calc(id,who){
  if(who===undefined) who=isCon()?ME.name:null;
  if(isCon()) who=ME.name;
  const s=site(id), rows=PAYS.filter(p=>p.siteId===id);
  const all=worksOf(s).map(w=>calcWork(w,rows));
  const works=who?all.filter(w=>same(w.contractor,who)):all;
  const T=k=>works.reduce((a,w)=>a+w[k],0);
  const sumS=ty=>rows.filter(p=>p.type===ty).reduce((a,b)=>a+(Number(b.amount)||0),0);
  const cPerPole=(s.clientBasis||s.basis)==='pole', cPoles=Number(s.poles)||0, cRate=Number(s.clientRate)||0;
  const client=cPerPole?cRate*cPoles:(Number(s.clientAmount)||0);          // X — from client
  const allY=all.reduce((a,w)=>a+w.contract,0), ourExp=sumS('ourexp'), recd=sumS('received');
  return {works,cPerPole,cPoles,cRate,client,ourExp,recd,
    contract:T('contract'), paid:T('paid'), conExp:T('conExp'), earned:T('earned'),
    balance:T('balance'), dueNow:T('dueNow'), conMargin:T('conMargin'),
    profit:client-allY-ourExp,            // OUR margin (all contractors)
    clientDue:client-recd, count:rows.length};
}
function byCat(id,type,who){
  const ids=type==='expense'?new Set(calc(id,who).works.map(w=>w.id)):null;
  const o={}; PAYS.filter(p=>p.siteId===id&&p.type===type&&(!ids||ids.has(wid(p))))
    .forEach(p=>{const k=p.category||'Other'; o[k]=(o[k]||0)+(Number(p.amount)||0);});
  return Object.entries(o).sort((a,b)=>b[1]-a[1]);
}
const sumOf=(list,k,who)=>list.reduce((a,s)=>a+calc(s.id,who)[k],0);

/* Pure-JS SHA-256 — used when the browser/viewer has no crypto.subtle (in-app viewers, http pages) */
function sha256js(bytes){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l=bytes.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n); m.set(bytes); m[l]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(n-4,(l*8)>>>0); dv.setUint32(n-8,Math.floor(l/0x20000000));
  const w=new Uint32Array(64), r=(x,s)=>(x>>>s)|(x<<(32-s));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){ const a=w[i-15],b=w[i-2]; w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(b,17)^r(b,19)^(b>>>10)))>>>0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0;
      const t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
async function hash(uid,pass){
  const data=new TextEncoder().encode('entrix|'+String(uid).trim().toLowerCase()+'|'+pass);
  try{
    if(window.crypto&&crypto.subtle){ const b=await crypto.subtle.digest('SHA-256',data);
      return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  }catch(e){}
  return sha256js(data);
}

async function login(uid,pass,keep){
  uid=String(uid||'').trim(); pass=String(pass||'').trim(); const err=$('pinErr');
  if(!uid||!pass){ err.textContent='Enter user ID and password'; return; }
  err.textContent='Checking…';
  /* Admin check first — needs nothing else to work */
  if(uid.toLowerCase()===ADMIN_ID.toLowerCase() && pass===ADMIN_PASS){
    let ah=''; try{ ah=await hash(ADMIN_ID,ADMIN_PASS); }catch(e){}
    if(keep&&ah) session.set({uid:ADMIN_ID,h:ah}); ME={name:'Admin',role:'owner',id:null,h:ah}; unlock(); return; }
  let h=''; try{ h=await hash(uid,pass); }catch(e){ err.textContent='Sign-in error: '+e.message; return; }
  if(uid.toLowerCase()===ADMIN_ID.toLowerCase() && pass===ADMIN_PASS){
    if(keep) session.set({uid:ADMIN_ID,h}); ME={name:'Admin',role:'owner',id:null,h}; unlock(); return; }
  const p=findUser(uid);
  if(p && p.passHash && p.passHash===h){
    if(keep) session.set({uid:p.uid,h}); ME={name:p.name,role:'contractor',id:p.id,h}; unlock(); return; }
  err.textContent=(LIVE&&!peopleLoaded)?'Still connecting — try again in a moment':'Wrong user ID or password';
  $('lPass').value='';
}

  return `<div class="card wcard">
    <div class="wh"><div><b>${esc(w.work||'Work')}</b><span>${own?esc(w.contractor||'No contractor yet'):'Your work'}</span></div>
      <span class="badge rate">${w.perPole?`${money(w.rate)}/pole × ${w.poles}`:'Lump sum'}</span></div>
    ${w.pct!==null?`<div class="bar${w.pct>=100?' full':''}" style="margin-top:4px"><i style="width:${w.pct}%"></i></div>
      <div class="barlbl" style="margin-bottom:6px"><span>${w.done} of ${w.poles} poles done</span><span>${w.pct}%</span></div>`:''}
    <div class="tot"><span>Contract</span><b class="num">${money(w.contract)}</b></div>
    <div class="tot"><span>${own?'Paid / advances':'Received'}</span><b class="num">${money(w.paid)}</b></div>
    ${w.perPole?`<div class="tot"><span>${own?'Payable':'Due'} for ${w.done} pole${w.done===1?'':'s'} done</span><b class="num ${w.dueNow>0?'neg':'pos'}">${money(w.dueNow)}</b></div>`:''}
    <div class="tot"><span><b>Balance on contract</b></span><b class="num ${w.balance>0?'neg':'pos'}">${money(w.balance)}</b></div>
    <div class="tot" style="font-size:12.5px;color:var(--muted)"><span>${own?'His':'Your'} expenses ${money(w.conExp)}</span><span>${own?'His':'Your'} margin <b class="num ${w.conMargin>=0?'pos':'neg'}">${money(w.conMargin)}</b></span></div>
    ${own?`<div class="two" style="margin:10px 0 0">
      <button class="btn sm" data-pay="${esc(w.id)}">₹ Pay ${esc((w.contractor||'').split(' ')[0]||'contractor')}</button>
      <button class="btn ghost sm" data-stmt="${esc(w.contractor||'')}"${w.contractor?'':' disabled'}>Statement PDF</button></div>`:''}
  </div>`;
}

function renderDetail(){
  const s=site(openId), c=calc(openId), pr=c.profit, done=(s.status||'active')==='done';
  if(!s.name){ if(justMade[openId]&&Date.now()-justMade[openId]<15000) return; go('sites'); return; }

  if(isOwner()){
    $('detailHead').innerHTML=`
    <div class="grand ${pr>=0?'win':'lose'}">
      <div class="k">${esc(s.name)} · net profit${done?' · completed':''}</div>
      <div class="v num ${pr>=0?'g':'r'}">${money(pr)}</div>
      <div class="split">
        <div>Client (X)${c.cPerPole?`<br><span style="opacity:.75">${c.cPoles} × ${money(c.cRate)}</span>`:''}<b class="num">${money(c.client)}</b></div>
        <div>Contractors (Y)<br><span style="opacity:.75">${c.works.length} work${c.works.length===1?'':'s'}</span><b class="num">${money(c.contract)}</b></div>
        <div>Our expenses<b class="num">${money(c.ourExp)}</b></div>
      </div>
    </div>
    <div class="card">
      <div class="tot h"><span>Client${s.client?' · '+esc(s.client):''}</span></div>
      <div class="tot"><span>Contract (X)</span><b class="num">${money(c.client)}</b></div>
      <div class="tot"><span>Received</span><b class="num">${money(c.recd)}</b></div>
      <div class="tot key"><span><b>Still to receive</b></span><b class="num ${c.clientDue>0?'neg':'pos'}">${money(c.clientDue)}</b></div>
    </div>
    <div class="eyebrow">Contractors &amp; work · ${c.works.length}</div>
    ${c.works.map(workCard).join('')||'<div class="card empty" style="padding:18px"><b>No contractor yet</b>Add who does which work.</div>'}
    <button class="btn ghost sm" id="addWorkBtn" style="margin-bottom:12px">+ Add contractor / work</button>
    ${catCard('Company expenses by type',byCat(openId,'ourexp'),c.ourExp)}
    ${catCard('Contractor expenses by type',byCat(openId,'expense',null),c.conExp)}
    <div class="two">
      <button class="btn ghost sm" id="editSiteBtn">Edit site</button>
      <button class="btn ghost sm" id="statusBtn">${done?'Re-open site':'Mark completed'}</button>
    </div>`;
    $('editSiteBtn').onclick=()=>showEdit();
    $('addWorkBtn').onclick=()=>showEdit(true);
    $('detailHead').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>openSheet('payment',b.dataset.pay));
    $('detailHead').querySelectorAll('[data-stmt]').forEach(b=>b.onclick=()=>statement(openId,b.dataset.stmt));
    $('statusBtn').onclick=async()=>{
      const st=done?'active':'done';
      if(LIVE) await W(window.FS.updateDoc(window.FS.doc(db,'jobs',openId),{status:st}));
      s.status=st; toast(st==='done'?'Marked completed':'Site re-opened'); render();
    };
  } else {
    $('detailHead').innerHTML=`
    <div class="grand">
      <div class="k">${esc(s.name)} · balance to receive</div>
      <div class="v num ${c.balance>0?'r':'g'}">${money(c.balance)}</div>
      <div class="split">
        <div>Your contract<b class="num">${money(c.contract)}</b></div>
        <div>Received<b class="num">${money(c.paid)}</b></div>
        <div>Your expenses<b class="num">${money(c.conExp)}</b></div>
      </div>
    </div>
    ${c.works.length>1?`<div class="eyebrow">Your work on this site · ${c.works.length}</div>`:''}
    ${c.works.map(workCard).join('')}
    ${catCard('Your expenses by type',byCat(openId,'expense'),c.conExp)}`;
  }

  /* ledger */
  const myIds=new Set(c.works.map(w=>w.id)), wById=Object.fromEntries(calc(openId,null).works.map(w=>[w.id,w]));
  const rows=PAYS.filter(p=>p.siteId===openId).filter(p=>!isCon()||(CON_TYPES.includes(p.type)&&myIds.has(wid(p))));
  const types=[...new Set(rows.map(p=>p.type))];
  const workChips=isOwner()&&c.works.length>1?c.works.map(w=>['w:'+w.id,(w.contractor||w.work||'Work').split(' ')[0]]):[];
  const chips=[['all','All'],...types.map(x=>['t:'+x,tag(x)]),...workChips];
  $('ledChips').innerHTML=chips.length>2?chips.map(([k,l])=>`<button class="chip${ledF===k?' on':''}" data-l="${esc(k)}">${esc(l)}</button>`).join(''):'';
  $('ledChips').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ledF=b.dataset.l;renderDetail();});
  const shown=rows.filter(p=>ledF==='all'||(ledF.startsWith('t:')&&p.type===ledF.slice(2))||(ledF.startsWith('w:')&&CON_TYPES.includes(p.type)&&wid(p)===ledF.slice(2)))
    .sort((a,b)=>(a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0)));
  const showWork=(isOwner()&&c.works.length>1)||(isCon()&&c.works.length>1);
  $('entryHead').textContent=isCon()?'My entries':'All entries';
  $('entryList').innerHTML=shown.length?shown.map(p=>payRow(p,showWork?wById[wid(p)]:null)).join(''):'<div class="empty"><b>Nothing yet</b>Tap “+ Add entry” to record one.</div>';
  $('entryList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!arm(b,'Delete','Tap to confirm')) return;
    if(LIVE) await W(window.FS.deleteDoc(window.FS.doc(db,'payments',b.dataset.del)));
    else { PAYS=PAYS.filter(x=>x.id!==b.dataset.del); render(); }
    toast('Deleted');
  });

  drawPhotos();
  $('reportBtnWrap').innerHTML = isOwner()
    ? `<button class="btn dark" id="projBtn">Project statement (PDF)</button>`
    : `<button class="btn ghost" id="stmtBtn">Download my statement (PDF)</button>`;
  if($('projBtn')) $('projBtn').onclick=()=>projectStatement(openId);
  if($('stmtBtn')) $('stmtBtn').onclick=()=>statement(openId,ME.name);
}
function payRow(p,w){
  const meta=TYPE[p.type]||{col:'#999'};
  const canDel = isOwner() || (isCon() && p.by===ME.name);
  const amt = p.type==='progress' ? `${p.qty||0} pole${(p.qty||0)==1?'':'s'}` : money(p.amount);
  const wl = w&&CON_TYPES.includes(p.type) ? (isOwner()?workLabel(w):(w.work||'')) : '';
  return `<div class="ent"><i class="dot" style="background:${meta.col}"></i><div class="body">
    <div class="t1">${esc(tag(p.type))}${p.category?` <span style="font-weight:500;color:var(--muted);font-size:12px">· ${esc(p.category)}</span>`:''}</div>
    ${wl?`<div class="t2" style="color:var(--navy);font-weight:700">${esc(wl)}</div>`:''}
    <div class="t2">${esc([dmy(p.date),p.mode,p.note,p.by?'by '+p.by:''].filter(Boolean).join(' · '))}</div>
    ${canDel?`<button class="del" data-del="${esc(p.id)}">Delete</button>`:''}
  </div><div class="amt num">${amt}</div></div>`;
}

/* ═══════════ 7b. Add-entry sheet ═══════════ */
$('fab').onclick=()=>openSheet();
$('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeSheet(); });
function closeSheet(){ $('sheet').classList.remove('open'); }
function sheetTypes(){
  const c=calc(openId), hasWork=c.works.length>0, hasPoles=c.works.some(w=>w.poles>0);
  const ty=isCon()?(canExp()?['expense','advance']:['advance']):(hasWork?['payment','ourexp','received']:['ourexp','received']);
  if(hasPoles) ty.push('progress');
  return ty;
}
function sheetWorks(ty){
  const ws=calc(openId).works;
  if(ty==='progress'){ const p=ws.filter(w=>w.poles>0); return p.length?p:ws; }
  return ws;
}
function openSheet(ty,workId){ const ts=sheetTypes(); sheetT=ts.includes(ty)?ty:ts[0]; sheetW=workId||null; drawSheet(); $('sheet').classList.add('open'); }
function drawSheet(keep){
  const ts=sheetTypes(), ty=sheetT, isQ=ty==='progress', isX=ty==='expense'||ty==='ourexp', k=keep||{};
  const ws=CON_TYPES.includes(ty)?sheetWorks(ty):[];
  const selW=k.work||sheetW||(ws[0]&&ws[0].id);
  $('sheetBody').innerHTML=`
    <div class="sheet-h"><b>${esc(site(openId).name)}</b><button id="shX" aria-label="Close">✕</button></div>
    <div class="seg" style="grid-template-columns:repeat(${ts.length>3?2:ts.length},1fr)">
      ${ts.map(x=>`<button data-t="${x}" class="${x===ty?'on':''}">${TYPE[x].btn}</button>`).join('')}</div>
    ${ws.length>1?`<div class="field"><label for="pWork">${isOwner()?'Contractor / work':'Which work'}</label>
      <select id="pWork">${ws.map(w=>`<option value="${esc(w.id)}"${w.id===selW?' selected':''}>${esc(isOwner()?workLabel(w):(w.work||'Work'))}${w.poles&&isQ?` (${w.done}/${w.poles})`:''}</option>`).join('')}</select></div>`
      :ws.length===1&&isOwner()?`<div class="hint" style="margin:0 0 12px">${esc(workLabel(ws[0]))}</div>`:''}
    <div class="field"><label for="pAmt">${isQ?'Poles installed':'Amount'}</label>
      ${isQ?`<input id="pAmt" type="tel" inputmode="numeric" placeholder="0" value="${esc(k.amt||'')}">`
           :`<div class="rupee"><span class="c">₹</span><input id="pAmt" type="tel" inputmode="decimal" placeholder="0" value="${esc(k.amt||'')}"></div>`}</div>
    <div class="row">
      <div class="field"><label for="pDate">Date</label><input id="pDate" type="date" value="${esc(k.date||today())}"></div>
      ${isQ?'<div></div>':isX
        ?`<div class="field"><label for="pCat">Type</label><select id="pCat">${CATS.map(x=>`<option${x===k.cat?' selected':''}>${x}</option>`).join('')}</select></div>`
        :`<div class="field"><label for="pMode">Mode</label><select id="pMode">${['Cash','UPI','Bank transfer','Cheque'].map(x=>`<option${x===k.mode?' selected':''}>${x}</option>`).join('')}</select></div>`}
    </div>
    <div class="field"><label for="pNote">Remark</label><input id="pNote" value="${esc(k.note||'')}" placeholder="${isQ?'e.g. poles erected near gate':isX?'e.g. diesel, loading, nashta for 6':'e.g. advance, part payment, final'}"></div>
    <button class="btn" id="payBtn">Save</button>`;
  $('shX').onclick=closeSheet;
  $('sheetBody').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    const keepNow={amt:$('pAmt').value,date:$('pDate').value,note:$('pNote').value,work:$('pWork')?$('pWork').value:selW};
    sheetT=b.dataset.t; drawSheet(keepNow);
  });
  $('payBtn').onclick=savePay;
}
async function savePay(){
  const ty=sheetT, amt=parseFloat($('pAmt').value);
  if(!(amt>0)) return toast('Enter '+(ty==='progress'?'number of poles':'an amount'),true);
  const rec={ siteId:openId, type:ty, date:$('pDate').value||today(), note:$('pNote').value.trim(), by:ME.name, createdAt:Date.now() };
  if(CON_TYPES.includes(ty)){
    const ws=sheetWorks(ty), id=$('pWork')?$('pWork').value:(sheetW&&ws.some(w=>w.id===sheetW)?sheetW:(ws[0]&&ws[0].id));
    const w=ws.find(x=>x.id===id); if(!w) return toast('Add a contractor to this site first',true);
    rec.workId=w.id; rec.contractor=w.contractor||''; rec.work=w.work||'';
  }
  if(ty==='progress'){ rec.qty=Math.round(amt); rec.amount=0; }
  else { rec.amount=Math.round(amt*100)/100; }
  if(ty==='expense'||ty==='ourexp') rec.category=$('pCat').value; else if(ty!=='progress') rec.mode=$('pMode').value;
  $('payBtn').disabled=true;
  if(LIVE) await W(window.FS.addDoc(window.FS.collection(db,'payments'),rec));
  else { PAYS.unshift({id:'p'+Date.now(),...rec}); render(); }
  closeSheet(); toast('Saved — '+(ty==='progress'?rec.qty+' poles':money(rec.amount))+(rec.contractor&&isOwner()?' · '+rec.contractor:''));
}

/* ═══════════ 7c. Site photos ═══════════
   Photos are shrunk on the phone (~100–250 KB) and kept in Firestore, so no paid
   Firebase Storage plan is needed. Only the open site's photos are downloaded. */
let photoSig='', uploading=false, vIdx=0, justAdded=[];
function watchPhotos(id){
  if(unPhotos){ unPhotos(); unPhotos=null; }
  if(!LIVE) return;
  const fs=window.FS; PHOTOS=[];
  unPhotos=fs.onSnapshot(fs.query(fs.collection(db,'photos'),fs.where('siteId','==',id)),
    s=>{ PHOTOS=s.docs.map(d=>({id:d.id,...d.data()})); drawPhotos(); },
    e=>{ if($('photoBox')) $('photoBox').innerHTML='<div class="banner" style="margin:0">Photos blocked: '+esc(e.code||e.message)+' — check Firestore rules.</div>'; });
}
const sitePhotos=()=>PHOTOS.filter(p=>p.siteId===openId).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
function drawPhotos(force){
  if(!openId||!$('photoBox')) return;
  const ph=sitePhotos(), sig=openId+'|'+uploading+'|'+justAdded.length+'|'+ph.map(p=>p.id).join(',');
  if(!force&&sig===photoSig) return;      // don't wipe a caption being typed
  photoSig=sig;
  $('photoBox').innerHTML=`
    ${justAdded.length?`<div class="sharebar"><span>✓ ${justAdded.length} photo${justAdded.length>1?'s':''} added</span>
      <button class="wa" id="phShareNew">${WA_ICON} Share on WhatsApp</button><button class="x" id="phShareX" aria-label="Dismiss">✕</button></div>`:''}
    ${ph.length?`<div class="pgrid">${ph.map((p,i)=>`<button data-ph="${i}" aria-label="Open photo ${i+1}"><img src="${p.thumb||p.full}" alt="${esc(p.note||'Site photo')}" loading="lazy"></button>`).join('')}</div>`
      :'<div class="empty" style="padding:10px 4px 14px"><b>No photos yet</b>Add photos of installed poles as proof of work.</div>'}
    <div class="field" style="margin:12px 0 9px"><input id="phNote" placeholder="Caption (optional) — e.g. Pole 5 erected" aria-label="Photo caption"></div>
    <label class="btn dark sm" for="phIn" style="text-align:center${uploading?';opacity:.5;pointer-events:none':''}">${uploading?'Uploading…':'📷 Add photos'}</label>
    <input type="file" id="phIn" accept="image/*" multiple hidden>
    ${ph.length?`<button class="btn ghost sm" id="phPdf" style="margin-top:9px">Photo report (PDF) · ${ph.length}</button>`:''}`;
  $('photoBox').querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>openViewer(+b.dataset.ph));
  $('phIn').onchange=e=>{ const f=[...e.target.files]; e.target.value=''; if(f.length) uploadPhotos(f); };
  if($('phPdf')) $('phPdf').onclick=photoReport;
  if($('phShareNew')) $('phShareNew').onclick=()=>{ const l=justAdded.slice(); justAdded=[]; drawPhotos(true); sharePhotos(l); };
  if($('phShareX')) $('phShareX').onclick=()=>{ justAdded=[]; drawPhotos(true); };
}
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), i=new Image();
  i.onload=()=>{ URL.revokeObjectURL(u); res(i); }; i.onerror=()=>rej(new Error('not an image')); i.src=u; }); }
function shrink(img,max,q){
  const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
async function uploadPhotos(files){
  const note=($('phNote')&&$('phNote').value.trim())||'', siteId=openId;
  uploading=true; drawPhotos(true);
  let ok=0; const added=[];
  for(let n=0;n<files.length;n++){
    toast(`Uploading photo ${n+1} of ${files.length}…`);
    try{
      const img=await loadImg(files[n]);
      let full='';
      for(const [m,q] of [[1280,.72],[1280,.6],[1024,.6],[1024,.5],[800,.5],[640,.45]]){ full=shrink(img,m,q); if(full.length<900000) break; }
      const rec={siteId,full,thumb:shrink(img,320,.6),note,by:ME.name,date:today(),createdAt:Date.now()};
      if(LIVE) await W(window.FS.addDoc(window.FS.collection(db,'photos'),rec));
      else PHOTOS.unshift({id:'ph'+Date.now()+'_'+n,...rec});
      ok++; added.push(rec);
    }catch(e){ toast(`Photo ${n+1} failed: ${e.message||e}`,true); }
  }
  uploading=false; justAdded=added; drawPhotos(true);
  if(ok) toast(ok>1?`${ok} photos saved — tap Share on WhatsApp`:'Photo saved — tap Share on WhatsApp');
}
function openViewer(i){ vIdx=i; drawViewer(); $('viewer').classList.add('open'); }
function closeViewer(){ $('viewer').classList.remove('open'); $('viewer').innerHTML=''; }
function drawViewer(){
  const ph=sitePhotos(), p=ph[vIdx]; if(!p){ closeViewer(); return; }
  const canDel=isOwner()||p.by===ME.name;
  $('viewer').innerHTML=`
    <div class="vtop"><span>${vIdx+1} / ${ph.length}</span><button id="vX" aria-label="Close">✕</button></div>
    <div class="vimg"><img src="${p.full}" alt="${esc(p.note||'Site photo')}"></div>
    <div class="vcap"><b>${esc(p.note||'')}</b><span>${esc([dmy(p.date),p.by?'by '+p.by:''].filter(Boolean).join(' · '))}</span></div>
    <button class="wa" id="vS" style="width:100%;margin-bottom:8px">${WA_ICON} Share on WhatsApp</button>
    <div class="vnav"><button id="vP"${vIdx?'':' disabled'}>‹ Prev</button>${canDel?'<button id="vD">Delete</button>':'<span></span>'}<button id="vN"${vIdx<ph.length-1?'':' disabled'}>Next ›</button></div>`;
  $('vX').onclick=closeViewer;
  $('vS').onclick=()=>sharePhotos([p]);
  $('vP').onclick=()=>{ if(vIdx>0){ vIdx--; drawViewer(); } };
  $('vN').onclick=()=>{ if(vIdx<ph.length-1){ vIdx++; drawViewer(); } };
  if($('vD')) $('vD').onclick=async()=>{
    if(!arm($('vD'),'Delete','Tap to confirm')) return;
    try{
      if(LIVE) await W(window.FS.deleteDoc(window.FS.doc(db,'photos',p.id)));
      else PHOTOS=PHOTOS.filter(x=>x.id!==p.id);
      closeViewer(); drawPhotos(true); toast('Photo deleted');
    }catch(e){ toast('Could not delete: '+e.message,true); }
  };
}
const WA_ICON='<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-3px"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>';
function dataUrlToFile(d,name){
  const b=atob(d.split(',')[1]), u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
  return new File([u],name,{type:'image/jpeg'});
}
/* Opens the phone's share sheet with the photo(s) attached → pick WhatsApp.
   Where the browser can't attach files, the photo is downloaded and WhatsApp opens with the caption. */
async function sharePhotos(list){
  list=list.filter(p=>p&&p.full); if(!list.length) return;
  const s=site(openId), slug=String(s.name||'site').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');
  const files=list.map((p,i)=>dataUrlToFile(p.full,`${slug}-${p.date||today()}-${i+1}.jpg`));
  const notes=[...new Set(list.map(p=>p.note).filter(Boolean))].join(', ');
  const text=`ENTRIX Innovation — ${s.name||''}${notes?'\n'+notes:''}\n${dmy(list[0].date)}${list[0].by?' · by '+list[0].by:''}`;
  try{
    if(navigator.canShare&&navigator.canShare({files})){ await navigator.share({files,text,title:s.name||'Site photo'}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  try{
    files.forEach(f=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); });
  }catch(e){}
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
  toast('Photo downloaded — attach it in WhatsApp from your gallery');
}
function photoReport(){
  const s=site(openId), ph=sitePhotos().slice().reverse();
  const sub=isOwner()?esc([s.client,siteCons(s).length?'Contractors: '+siteCons(s).join(', '):''].filter(Boolean).join(' · ')):esc(ME.name);

/* ═══════════ 8. Add / edit site ═══════════ */
const num=v=>Math.round(parseFloat(v)||0);
const blankWork=()=>({id:newWid(),contractor:'',work:'',basis:'pole',poles:'',rate:'',amount:''});
function showEdit(addWork){
  const s=openId?site(openId):{};
  draft={ name:s.name||'', client:s.client||'',
    clientBasis:openId?((s.clientBasis||s.basis)==='pole'?'pole':'lump'):'pole',
    poles:s.poles||'', clientRate:s.clientRate||'', clientAmount:s.clientAmount||'',
    works:worksOf(s).map(w=>({...w})) };
  if(!draft.works.length||addWork) draft.works.push(blankWork());
  go('edit'); renderEdit();
  if(addWork) setTimeout(()=>{ const l=document.querySelectorAll('.wedit'); if(l.length) l[l.length-1].scrollIntoView({behavior:'smooth',block:'center'}); },60);
}
function syncDraft(){
  if(!draft||!$('eName')) return;
  draft.name=$('eName').value; draft.client=$('eClient').value;
  draft.poles=$('ePoles')?$('ePoles').value:draft.poles; draft.clientRate=$('eCR')?$('eCR').value:draft.clientRate;
  draft.clientAmount=$('eX')?$('eX').value:draft.clientAmount;
  document.querySelectorAll('[data-wi]').forEach(inp=>{ const w=draft.works[+inp.dataset.wi]; if(w) w[inp.dataset.wk]=inp.value; });
}
function renderEdit(){
  const d=draft, cp=d.clientBasis==='pole';
  const cons=PEOPLE.filter(p=>p.role==='contractor').map(p=>`<option value="${esc(p.name)}"></option>`).join('');
  const used=new Set(PAYS.filter(p=>p.siteId===openId&&CON_TYPES.includes(p.type)).map(wid));
  $('editForm').innerHTML=`
    <div class="eyebrow">${openId?'Edit site':'New site'}</div>
    <div class="card">
      <div class="field"><label for="eName">Site name</label><input id="eName" value="${esc(d.name)}" placeholder="e.g. Wani 68 pole installation"></div>
      <div class="field"><label for="eClient">Client</label><input id="eClient" value="${esc(d.client)}" placeholder="Client name"></div>
      <div class="field"><label>Contract from client (X)</label>
        <div class="seg" id="cSeg" style="grid-template-columns:1fr 1fr;margin-bottom:10px">
          <button data-b="pole" class="${cp?'on':''}">Pole wise</button><button data-b="lump" class="${cp?'':'on'}">Lump sum</button></div>
        ${cp?`<div class="row">
            <div><label for="ePoles">Number of poles</label><input id="ePoles" type="tel" inputmode="numeric" value="${esc(d.poles)}" placeholder="0"></div>
            <div><label for="eCR">Client rate / pole</label><div class="rupee"><span class="c">₹</span><input id="eCR" type="tel" inputmode="decimal" value="${esc(d.clientRate)}" placeholder="1000"></div></div></div>`
          :`<div class="rupee"><span class="c">₹</span><input id="eX" type="tel" inputmode="decimal" value="${esc(d.clientAmount)}" placeholder="Total contract amount"></div>`}
      </div>
    </div>

    <div class="eyebrow">Contractors &amp; work · ${d.works.length}</div>
    <datalist id="conList">${cons}</datalist>
    <datalist id="workList">${WORKS.map(w=>`<option value="${esc(w)}"></option>`).join('')}</datalist>
    ${d.works.map((w,i)=>{ const p=w.basis==='pole'; return `
    <div class="card wedit">
      <div class="wh" style="margin-bottom:10px"><b>Work ${i+1}</b>
        <button class="btn danger sm mini" data-wrm="${i}">${used.has(w.id)?'Has entries':'Remove'}</button></div>
      <div class="row">
        <div class="field"><label>Contractor</label><input data-wi="${i}" data-wk="contractor" list="conList" value="${esc(w.contractor)}" placeholder="e.g. Umesh Giri" autocomplete="off"></div>
        <div class="field"><label>Work</label><input data-wi="${i}" data-wk="work" list="workList" value="${esc(w.work)}" placeholder="e.g. Civil foundation" autocomplete="off"></div>
      </div>
      <div class="seg" style="grid-template-columns:1fr 1fr;margin-bottom:10px">
        <button data-wb="${i}" data-b="pole" class="${p?'on':''}">Pole wise</button><button data-wb="${i}" data-b="lump" class="${p?'':'on'}">Lump sum</button></div>
      <div class="row">
        ${p?`<div class="field"><label>Rate / pole</label><div class="rupee"><span class="c">₹</span><input data-wi="${i}" data-wk="rate" type="tel" inputmode="decimal" value="${esc(w.rate||'')}" placeholder="700"></div></div>`
           :`<div class="field"><label>Amount</label><div class="rupee"><span class="c">₹</span><input data-wi="${i}" data-wk="amount" type="tel" inputmode="decimal" value="${esc(w.amount||'')}" placeholder="0"></div></div>`}
        <div class="field"><label>Poles${p?'':' (for progress)'}</label><input data-wi="${i}" data-wk="poles" type="tel" inputmode="numeric" value="${esc(w.poles||'')}" placeholder="${esc(cp&&d.poles?d.poles:'0')}"></div>
      </div>
      <div class="whint" data-wh="${i}"></div>
    </div>`;}).join('')}
    <button class="btn ghost sm" id="eAddW" style="margin-bottom:12px">+ Add another contractor / work</button>

      <div class="hint" id="eCalc" style="margin-top:0"></div>

      ${openId?'<button class="btn danger sm" id="eDel" style="margin-top:9px">Delete site</button>':''}
    </div>`;

  const upd=()=>{
    syncDraft();
    const cpp=d.clientBasis==='pole', n=num(d.poles);
    const x=cpp?num(d.clientRate)*n:num(d.clientAmount);
    let y=0;
    d.works.forEach((w,i)=>{
      const wp=num(w.poles)||(cpp?n:0), v=w.basis==='pole'?num(w.rate)*wp:num(w.amount); y+=v;
      const h=document.querySelector(`[data-wh="${i}"]`);
      if(h) h.textContent=v?`= ${money(v)}${w.basis==='pole'?` (${wp} × ${money(num(w.rate))})`:''}`:'';
    });
    const perPole=cpp&&d.works.length&&d.works.every(w=>w.basis==='pole')
      ? `<br>Per pole: client ${money(num(d.clientRate))} − contractors ${money(d.works.reduce((a,w)=>a+num(w.rate),0))} = <b>${money(num(d.clientRate)-d.works.reduce((a,w)=>a+num(w.rate),0))}</b>`:'';
    $('eCalc').innerHTML=(x||y)?`Client (X) <b>${money(x)}</b> − Contractors (Y) <b>${money(y)}</b> = Gross profit <b>${money(x-y)}</b>${perPole}<br><span style="color:var(--muted)">Company expenses logged on the site reduce this.</span>`
      :'Enter the client contract and each contractor’s rate to see your margin.';
  };
  $('editForm').querySelectorAll('input').forEach(i=>i.addEventListener('input',upd)); upd();
  $('cSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ syncDraft(); d.clientBasis=b.dataset.b; renderEdit(); });
  $('editForm').querySelectorAll('[data-wb]').forEach(b=>b.onclick=()=>{ syncDraft(); d.works[+b.dataset.wb].basis=b.dataset.b; renderEdit(); });
  $('editForm').querySelectorAll('[data-wrm]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.wrm, w=d.works[i];
    if(used.has(w.id)) return toast('This work has payments/entries — delete those entries first',true);
    syncDraft(); d.works.splice(i,1); renderEdit();
  });
  $('eAddW').onclick=()=>{ syncDraft(); d.works.push(blankWork()); renderEdit();
    const l=document.querySelectorAll('.wedit'); l[l.length-1].scrollIntoView({behavior:'smooth',block:'center'}); };

  $('eSave').onclick=async()=>{
    syncDraft();
    const name=d.name.trim(); if(!name) return toast('Enter a site name',true);
    const cpp=d.clientBasis==='pole', n=num(d.poles), cr=num(d.clientRate);
    const works=d.works.filter(w=>String(w.contractor).trim()||String(w.work).trim()||num(w.rate)||num(w.amount)).map(w=>{
      const p=w.basis==='pole', poles=num(w.poles)||(cpp?n:0);
      return {id:w.id||newWid(), contractor:String(w.contractor).trim(), work:String(w.work).trim()||'Installation',
        basis:p?'pole':'lump', poles, rate:p?num(w.rate):0, amount:p?num(w.rate)*poles:num(w.amount)};
    });
    const lost=[...used].filter(id=>!works.some(w=>w.id===id));
    if(lost.length) return toast('A work with entries was emptied — fill it again or delete its entries',true);
    const rec={ name, client:d.client.trim(), clientBasis:cpp?'pole':'lump', basis:cpp?'pole':'lump',
      poles:cpp?n:0, clientRate:cpp?cr:0, clientAmount:cpp?cr*n:num(d.clientAmount),
      works, contractors:[...new Set(works.map(w=>w.contractor).filter(Boolean))],
      contractor:works[0]?works[0].contractor:'' };
    for(const nm of rec.contractors) if(!PEOPLE.some(x=>same(x.name,nm))){
      const pr={name:nm,role:'contractor',pin:''};
      if(LIVE) await W(window.FS.addDoc(window.FS.collection(db,'people'),pr)); else PEOPLE.push({id:'x'+Date.now()+nm,...pr});
    }
    if(LIVE){
      if(openId) await W(window.FS.updateDoc(window.FS.doc(db,'jobs',openId),rec));
      else { const ref=window.FS.doc(window.FS.collection(db,'jobs')); await W(window.FS.setDoc(ref,{...rec,status:'active',createdAt:Date.now()})); openId=ref.id; justMade[openId]=Date.now(); }
    }
    if(openId&&SITES.some(x=>x.id===openId)) Object.assign(site(openId),rec);
    else { openId=openId||('s'+Date.now()); SITES.push({id:openId,status:'active',...rec}); }
    toast('Site saved'); render(); showDetail(openId);
  };
  if(openId) $('eDel').onclick=async()=>{
    const b=$('eDel');
    if(!arm(b,'Delete site','Tap again to delete site + entries')) return;
    const rows=PAYS.filter(x=>x.siteId===openId);
    if(LIVE){ for(const r of rows) await W(window.FS.deleteDoc(window.FS.doc(db,'payments',r.id)));
              for(const ph of PHOTOS.filter(x=>x.siteId===openId)) await W(window.FS.deleteDoc(window.FS.doc(db,'photos',ph.id)));
              await W(window.FS.deleteDoc(window.FS.doc(db,'jobs',openId))); }
    PAYS=PAYS.filter(x=>x.siteId!==openId); PHOTOS=PHOTOS.filter(x=>x.siteId!==openId); SITES=SITES.filter(x=>x.id!==openId);
    openId=null; toast('Site deleted'); render(); go('sites');
  };
}

const validUid=u=>/^[a-z0-9._-]{3,20}$/i.test(u);
const uidTaken=(u,exceptId)=>u.toLowerCase()===ADMIN_ID.toLowerCase()||PEOPLE.some(p=>p.id!==exceptId&&(p.uid||'').toLowerCase()===u.toLowerCase());
const suggestUid=name=>String(name).trim().toLowerCase().split(/\s+/)[0].replace(/[^a-z0-9]/g,'');
const contractors=()=>PEOPLE.filter(p=>p.role==='contractor').sort((a,b)=>String(a.name).localeCompare(String(b.name)));
const appLink=()=>location.href.split('#')[0].split('?')[0];

/* Add / edit contractor — opens in the bottom sheet */
function personSheet(id){
  const p=id?PEOPLE.find(x=>x.id===id):null;
  $('sheetBody').innerHTML=`
    <div class="sheet-h"><b>${p?'Edit contractor':'Add contractor'}</b><button id="shX" aria-label="Close">✕</button></div>
    <div class="field"><label for="cName">Name</label><input id="cName" value="${esc(p?p.name:'')}" placeholder="e.g. Umesh Giri"></div>
    <div class="row">
      <div class="field"><label for="cUid">User ID</label><input id="cUid" value="${esc(p?(p.uid||suggestUid(p.name)):'')}" placeholder="e.g. umesh" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
      <div class="field"><label for="cPass">Password</label><input id="cPass" value="${esc(p&&p.pass?p.pass:'')}" placeholder="${p&&p.passHash&&!p.pass?'type a new one':'min 4 characters'}" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    </div>
    <label class="sw"><input type="checkbox" id="cExp"${p&&p.canExp?' checked':''}><i></i><span>Allow him to enter his own expenses</span></label>
    <button class="btn" id="cSave" style="margin-top:6px">${p?'Save changes':'Add contractor'}</button>`;
  $('sheet').classList.add('open');
  $('shX').onclick=closeSheet;
  if(!p){ $('cName').addEventListener('input',()=>{ if(!$('cUid').dataset.touched) $('cUid').value=suggestUid($('cName').value); });
          $('cUid').addEventListener('input',()=>{ $('cUid').dataset.touched='1'; }); }
  $('cSave').onclick=async()=>{
    const name=$('cName').value.trim(), uid=$('cUid').value.trim(), pass=$('cPass').value.trim(), canExp=$('cExp').checked;
    if(!name) return toast('Type a name',true);
    if(PEOPLE.some(x=>x.id!==(p&&p.id)&&x.role==='contractor'&&String(x.name).toLowerCase()===name.toLowerCase()&&x.uid)) return toast('A contractor with this name already exists',true);
    if(!validUid(uid)) return toast('User ID: 3–20 letters or numbers, no spaces',true);
    if(uidTaken(uid,p&&p.id)) return toast('That user ID is already used',true);
    const uidChanged=!p||(p.uid||'').toLowerCase()!==uid.toLowerCase();
    if(pass&&pass.length<4) return toast('Password must be at least 4 characters',true);
    if(!pass&&(uidChanged||!p.passHash)) return toast('Set a password',true);
    const rec={name,uid,canExp,role:'contractor',pin:''};
    if(pass){ rec.pass=pass; rec.passHash=await hash(uid,pass); }
    // an old contractor created from a site (no login yet) with the same name gets the login
    const target=p||PEOPLE.find(x=>x.role==='contractor'&&String(x.name).toLowerCase()===name.toLowerCase()&&!x.uid);
    const old=target?target.name:name, hit=old!==name?SITES.filter(x=>worksOf(x).some(w=>w.contractor===old)):[];
    const renamed=x=>{ const works=worksOf(x).map(w=>w.contractor===old?{...w,contractor:name}:w);
      return {works,contractors:[...new Set(works.map(w=>w.contractor).filter(Boolean))],contractor:works[0]?works[0].contractor:''}; };
    if(LIVE){
      if(target) await W(window.FS.updateDoc(window.FS.doc(db,'people',target.id),rec));
      else await W(window.FS.addDoc(window.FS.collection(db,'people'),rec));
      for(const x of hit){ const u=renamed(x); await W(window.FS.updateDoc(window.FS.doc(db,'jobs',x.id),u)); Object.assign(x,u); }
    } else {
      if(target) Object.assign(target,rec); else PEOPLE.push({id:'x'+Date.now(),...rec});
      hit.forEach(x=>Object.assign(x,renamed(x)));
    }
    closeSheet(); render(); renderPeople();
    toast(`${name} ${p?'updated':'added'} · ID: ${uid}${pass?' · Password: '+pass:''}`);
  };
}

/* ═══════════ 10. Reports (Admin) ═══════════ */
function repSites(){
  let l=SITES.slice();
  if(repCon) l=l.filter(s=>siteCons(s).some(n=>same(n,repCon)));
  if(repSt!=='all') l=l.filter(s=>(s.status||'active')===repSt);
  return l;
}
const repRows=l=>l.map(s=>({s,c:calc(s.id,null)}));
const allCons=()=>[...new Set(SITES.flatMap(siteCons))].sort();
function conRows(sites){
  const names=repCon?[repCon]:[...new Set(sites.flatMap(siteCons))].sort();
  return names.map(n=>{ const m=sites.filter(s=>siteCons(s).some(x=>same(x,n))); const k=key=>sumOf(m,key,n);
    return {n,sites:m.length,works:m.reduce((a,s)=>a+calc(s.id,n).works.length,0),contract:k('contract'),paid:k('paid'),conExp:k('conExp'),balance:k('balance')}; });
}
function renderReports(){
  if(!isOwner()){ $('v-reports').innerHTML=''; return; }
  $('v-reports').innerHTML=`
    <div class="eyebrow">Summary report</div>
    <div class="card">
      <div class="row">
        <div class="field"><label for="rCon">Contractor</label><select id="rCon"><option value="">All</option>${allCons().map(x=>`<option${same(x,repCon)?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
        <div class="field"><label for="rSt">Sites</label><select id="rSt">${[['all','All'],['active','Active'],['done','Completed']].map(([k,l])=>`<option value="${k}"${k===repSt?' selected':''}>${l}</option>`).join('')}</select></div>
      </div>
      <div id="rOut"></div>
    </div>
    <div class="two"><button class="btn dark sm" id="rPdf">Summary (PDF)</button><button class="btn ghost sm" id="rCsv">Download CSV</button></div>`;
  $('rCon').onchange=e=>{repCon=e.target.value;drawReport();};
  $('rSt').onchange=e=>{repSt=e.target.value;drawReport();};
  $('rPdf').onclick=summaryPdf; $('rCsv').onclick=csv;
  drawReport();
}
function drawReport(){
  const sites=repSites(), R=repRows(sites);
  if(!R.length){ $('rOut').innerHTML='<div class="empty">No sites match.</div>'; return; }
  const T=k=>R.reduce((a,r)=>a+r.c[k],0), C=conRows(sites);
  $('rOut').innerHTML=`<div class="tot h" style="margin-top:4px"><span>Site-wise</span></div>
    <div class="tblwrap"><table class="t"><tr><th>Site</th><th>Client X</th><th>Contractors Y</th><th>Our exp.</th><th>Profit</th><th>Paid</th><th>Balance</th></tr>
    ${R.map(({s,c})=>`<tr><td>${esc(s.name)}</td><td class="num">${money(c.client)}</td><td class="num">${money(c.contract)}</td><td class="num">${money(c.ourExp)}</td><td class="num ${c.profit>=0?'pos':'neg'}">${money(c.profit)}</td><td class="num">${money(c.paid)}</td><td class="num">${money(c.balance)}</td></tr>`).join('')}
    <tr class="tf"><td>Total</td><td class="num">${money(T('client'))}</td><td class="num">${money(T('contract'))}</td><td class="num">${money(T('ourExp'))}</td><td class="num ${T('profit')>=0?'pos':'neg'}">${money(T('profit'))}</td><td class="num">${money(T('paid'))}</td><td class="num">${money(T('balance'))}</td></tr></table></div>
    ${C.length?`<div class="tot h" style="margin-top:16px"><span>Contractor-wise</span></div>

function csv(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const out=[['Site','Client','Status','Client X','Company expenses','Net profit','Received from client','Work','Contractor','Basis','Rate/pole','Poles','Poles done','Contract','Paid','Balance','Contractor expenses']];
  repRows(repSites()).forEach(({s,c})=>{
    const ws=c.works.length?c.works:[null];
    ws.forEach((w,i)=>out.push([s.name,s.client,s.status||'active',i?'':c.client,i?'':c.ourExp,i?'':c.profit,i?'':c.recd,
      w?w.work:'',w?w.contractor:'',w?(w.perPole?'Pole wise':'Lump sum'):'',w&&w.perPole?w.rate:'',w?w.poles:'',w?w.done:'',w?w.contract:'',w?w.paid:'',w?w.balance:'',w?w.conExp:'']));
  });
  try{
    const blob=new Blob(['﻿'+out.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='entrix-sites-'+today()+'.csv';
    document.body.appendChild(a); a.click(); a.remove(); toast('CSV downloaded');
  }catch(e){ toast('Download not supported here',true); }
}

/* ═══════════ 11. PDFs ═══════════ */
const NAVY='#0A1F44';
const pdfHead=(title,sub)=>`<div style="border-bottom:2px solid ${NAVY};padding-bottom:8px;margin-bottom:14px">
  <div style="font-size:19px;font-weight:800;letter-spacing:.16em;color:${NAVY}">ENTRIX INNOVATION</div>
  <div style="font-size:13px;font-weight:700;margin-top:4px">${title}</div>
  <div style="font-size:10px;color:#555;margin-top:2px">${sub} · Nagpur · entrix.co.in · ${dmy(today())}</div></div>`;
const pdfLine=(l,v,b)=>`<tr><td style="padding:6px 0${b?`;border-top:1.5px solid ${NAVY};font-weight:800`:''}">${l}</td><td style="padding:6px 0${b?`;border-top:1.5px solid ${NAVY};font-weight:800`:''};text-align:right">${money(v)}</td></tr>`;
const pdfText=(l,v)=>`<tr><td style="padding:5px 0">${l}</td><td style="padding:5px 0;text-align:right">${v}</td></tr>`;
const pdfSub=x=>`<div style="font-size:12px;font-weight:800;color:${NAVY};margin:18px 0 4px;padding-top:8px;border-top:1px solid #ccc">${x}</div>`;
function pdfTable(title,heads,rows,foot){
  const th=heads.map((h,i)=>`<th style="text-align:${i===heads.length-1?'right':'left'};padding:5px 6px">${h}</th>`).join('');
  return `<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:${NAVY};margin:16px 0 6px">${title}</div>
  <table style="width:100%;border-collapse:collapse;font-size:11px"><tr style="background:${NAVY};color:#fff">${th}</tr>
  ${rows.length?rows.map(r=>`<tr>${r.map((x,i)=>`<td style="padding:4px 6px;border-bottom:1px solid #ddd;text-align:${i===r.length-1?'right':'left'}">${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" style="padding:6px;color:#666">None.</td></tr>`}
  ${foot?`<tr><td colspan="${heads.length-1}" style="padding:6px;font-weight:800;border-top:1.5px solid ${NAVY}">${foot[0]}</td><td style="padding:6px;text-align:right;font-weight:800;border-top:1.5px solid ${NAVY}">${foot[1]}</td></tr>`:''}</table>`;
}
const byDate=(rows)=>rows.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
const printNow=()=>setTimeout(()=>window.print(),150);

/* ── Real PDF files: made on the phone, then Share on WhatsApp / Download / Print ── */
const H2P='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
let h2pLoad=null, pdfJob=null;
function loadH2P(){
  if(window.html2pdf) return Promise.resolve();
  if(!h2pLoad) h2pLoad=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=H2P; s.onload=res;
    s.onerror=()=>{ h2pLoad=null; s.remove(); rej(new Error('PDF maker needs internet — try again')); }; document.head.appendChild(s); });
  return h2pLoad;
}
async function makePdf(html){
  await loadH2P();
  /* html2canvas draws blank/shifted pages when the phone is scrolled or narrower than
     the page, so: render in our own 720px box at the very top, scroll to top while
     drawing, then put the scroll back. */
  const y=window.scrollY;
  const box=document.createElement('div');
  box.style.cssText='position:absolute;left:0;top:0;width:680px;z-index:-1;pointer-events:none;background:#fff';
  box.innerHTML=`<div style="width:676px;padding:2px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#16202E;background:#fff">${html}</div>`;
  document.body.appendChild(box);
  window.scrollTo(0,0);
  try{
    return await window.html2pdf().set({
      margin:[10,10,12,10], image:{type:'jpeg',quality:.9},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0,windowWidth:720},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy'],avoid:['tr','img']}
    }).from(box.firstElementChild).outputPdf('blob');
  } finally { box.remove(); window.scrollTo(0,y); }
}
function saveBlob(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),30000);
}
function pdfReady(name,title){
  const file=String(name||'ENTRIX').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'')+'.pdf';
  const job={file,title,blob:null}; pdfJob=job;
  $('sheetBody').innerHTML=`
    <div class="sheet-h"><b>${esc(title)}</b><button id="shX" aria-label="Close">✕</button></div>
    <div class="pdfstat" id="pdfStat"><span class="spin"></span>Making PDF…</div>
    <button class="wa" id="pdfWa" style="width:100%;margin-bottom:9px" disabled>${WA_ICON} Share on WhatsApp</button>
    <div class="two" style="margin-bottom:0">
      <button class="btn ghost sm" id="pdfDl" disabled>⬇ Download PDF</button>
      <button class="btn ghost sm" id="pdfPr">🖨 Print</button></div>`;
  $('sheet').classList.add('open');
  $('shX').onclick=closeSheet;
  $('pdfPr').onclick=()=>{ closeSheet(); printNow(); };
  makePdf($('report').innerHTML).then(blob=>{
    if(pdfJob!==job||!$('pdfWa')) return;
    job.blob=blob;
    $('pdfStat').innerHTML=`✓ Ready · ${esc(file)} · ${Math.max(1,Math.round(blob.size/1024))} KB`; $('pdfStat').classList.add('ok');
    $('pdfWa').disabled=false; $('pdfDl').disabled=false;
  }).catch(e=>{ if(pdfJob!==job||!$('pdfStat')) return;
    $('pdfStat').textContent='Could not make PDF: '+(e.message||e)+' · you can still Print → Save as PDF'; $('pdfStat').classList.add('bad'); });
  $('pdfDl').onclick=()=>{ if(job.blob){ saveBlob(job.blob,file); toast('PDF saved to Downloads'); } };
  $('pdfWa').onclick=async()=>{
    if(!job.blob) return;
    const f=new File([job.blob],file,{type:'application/pdf'}), text='ENTRIX Innovation — '+title;
    try{
      if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title,text}); closeSheet(); return; }
    }catch(e){ if(e&&e.name==='AbortError') return; }
    saveBlob(job.blob,file);
    window.open('https://wa.me/?text='+encodeURIComponent(text+'\n(PDF attached from Downloads)'),'_blank');
    toast('PDF downloaded — attach it in WhatsApp from Downloads');
  };
}
const footer=()=>`<div style="margin-top:26px;font-size:10px;color:#666;border-top:1px solid #bbb;padding-top:7px">ENTRIX Innovation, Nagpur · entrix.co.in · GSTIN 27APMPP1315A1Z9 · Prepared by ${esc(ME.name)} · App v${APP_VERSION}</div>`;
const sumAmt=l=>money(l.reduce((a,b)=>a+(Number(b.amount)||0),0));
const lstRows=l=>l.map(p=>[dmy(p.date),esc(p.note||'—')+(p.category?` (${esc(p.category)})`:''),esc(p.mode||''),money(p.amount)]);

/* Contractor statement for ONE contractor on this site — no client amount, profit or company expenses */
function statement(id,who){

  const rows=byDate(PAYS.filter(p=>p.siteId===id&&CON_TYPES.includes(p.type)&&ids.has(wid(p))));

  const pays=rows.filter(p=>p.type==='payment'||p.type==='advance'), prog=rows.filter(p=>p.type==='progress');
  $('report').innerHTML=pdfHead('Contractor Statement — '+esc(who||''), esc(s.name))+`
    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px">
      ${c.works.map(w=>`${pdfLine(`${esc(w.work||'Work')}${w.perPole?` — ${money(w.rate)} × ${w.poles} poles`:' (lump sum)'}`,w.contract)}
        ${w.poles?pdfText('&nbsp;&nbsp;Poles done',`${w.done} of ${w.poles}${w.perPole?' · value '+money(w.earned):''}`):''}`).join('')}
      ${pdfLine('Total contract',c.contract,true)}

    ${prog.length?pdfTable('Poles installed',['Date',many?'Work':'Remark','By','Poles'],prog.map(p=>[dmy(p.date),many?wName(p):esc(p.note||''),esc(p.by||''),p.qty||0]),['Total poles',prog.reduce((a,p)=>a+(p.qty||0),0)]):''}
