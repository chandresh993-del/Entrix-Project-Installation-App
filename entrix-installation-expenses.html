<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F44">
<title>ENTRIX · Installation Expenses</title>
<style>
:root{
  --navy:#0A1F44; --amber:#F2A900; --amber-dim:#C88C05;
  --paper:#F4F6F9; --card:#fff; --ink:#16202E; --muted:#6B7789; --line:#DDE3EC;
  --green:#1B7F5A; --red:#C0392B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.45;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none;color:inherit}

header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;letter-spacing:.16em;font-size:13px}
.brand span{color:var(--amber)}
header .sub{font-size:11px;color:#9FB0CC;letter-spacing:.04em;margin-top:1px}
.whoami{margin-left:auto;text-align:right;font-size:11px;color:#9FB0CC}
.whoami b{display:block;color:#fff;font-size:12px}
.sync{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4B5C78;margin-right:5px;vertical-align:middle}
.sync.on{background:#3ED598}.sync.off{background:var(--amber)}

main{padding:14px 14px 24px;max-width:640px;margin:0 auto}
.view{display:none}.view.active{display:block}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:10px 4px 11px;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
nav button .ic{display:block;font-size:20px;line-height:1.25;font-weight:400}
nav button.on{color:var(--navy)}nav button.on .ic{color:var(--amber)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 2px 8px}
.eyebrow:first-child{margin-top:0}
label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 5px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(10,31,68,.09)}
.field{margin-bottom:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rupee{position:relative}.rupee .c{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.rupee input{padding-left:30px;font-weight:800}
.btn{display:block;width:100%;padding:14px;border-radius:10px;background:var(--amber);color:#241900;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:13px}
.btn:active{background:var(--amber-dim)}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.danger{background:#fff;border:1px solid #EBC3BE;color:var(--red)}
.btn.sm{padding:10px;font-size:12px}
.btn:disabled{opacity:.5}
.mini{width:auto;display:inline-block;padding:8px 13px;font-size:11px}

.site{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:11px;width:100%;text-align:left;display:block}
.site h3{margin:0;font-size:16px;font-weight:800}
.site .meta{font-size:12px;color:var(--muted);margin-top:3px}
.figs{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:10px}
.figs .big{font-size:22px;font-weight:800}
.figs small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.pos{color:var(--green)}.neg{color:var(--red)}

.grand{background:var(--navy);color:#fff;border-radius:14px;padding:18px;margin-bottom:12px}
.grand.win{background:linear-gradient(135deg,#0A1F44,#14472F)}
.grand.lose{background:linear-gradient(135deg,#0A1F44,#4A1E1A)}
.grand .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9FB0CC;font-weight:700}
.grand .v{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.grand .v.g{color:#3ED598}.grand .v.r{color:#FF8A7A}
.grand .split{display:flex;flex-wrap:wrap;gap:20px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;color:#C9D6EA}
.grand .split b{display:block;color:#fff;font-size:16px;font-weight:800;margin-top:1px}

.tot{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.tot:last-child{border-bottom:none}
.tot b{font-weight:800;white-space:nowrap}
.tot .neg{color:var(--red)}.tot .pos{color:var(--green)}

.ent{display:flex;gap:11px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
.ent:last-child{border-bottom:none}
.ent .body{flex:1;min-width:0}
.ent .t1{font-weight:700;font-size:14px}
.ent .t2{font-size:11.5px;color:var(--muted);margin-top:2px}
.ent .amt{font-weight:800;white-space:nowrap}
.ent .del{color:var(--red);font-size:11px;font-weight:700;margin-top:5px}
.ent .del.armed{background:var(--red);color:#fff;padding:2px 7px;border-radius:5px}

.empty{text-align:center;color:var(--muted);padding:32px 16px;font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}
.hint{font-size:12px;color:var(--muted);background:#F0F4FB;border:1px solid #DCE5F3;border-radius:8px;padding:10px 12px;margin-top:12px;line-height:1.5}
.hint b{color:var(--navy)}
.banner{background:#FFF6E0;border:1px solid #F0DCA8;color:#6B5310;font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:12px}

#gate{position:fixed;inset:0;background:var(--navy);z-index:50;display:flex;align-items:center;justify-content:center;padding:26px;overflow:auto}
#gate .box{width:100%;max-width:360px;text-align:center}
#gate .logo{font-weight:800;letter-spacing:.2em;color:#fff;font-size:18px}#gate .logo span{color:var(--amber)}
#gate .tag{color:#8C9BB5;font-size:13px;margin:6px 0 26px}
#gate input{text-align:center;font-size:28px;letter-spacing:.5em;font-weight:800;padding:15px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#fff}
#gate .err{color:var(--amber);font-size:12.5px;height:18px;margin:10px 0}
#gate .who{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:16px;margin-bottom:12px}
#gate .who:active{background:rgba(255,255,255,.1)}
#gate .who .ic{font-size:25px;width:32px;text-align:center;flex:none}
#gate .who b{display:block;color:#fff;font-size:16px}
#gate .who span{display:block;color:#8C9BB5;font-size:12px;margin-top:2px}
#gate .who .ch{margin-left:auto;color:#5E6E8C;font-size:20px}
#gate .foot{color:#6E7E9C;font-size:11px;margin-top:16px}
#gate .back{color:#8C9BB5;font-size:13px;font-weight:700;margin-bottom:16px;display:inline-block}

.toast{position:fixed;left:14px;right:14px;bottom:calc(82px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:13px 15px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:40;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}.toast.bad{background:var(--red)}
@media print{ header,nav,main,.toast{display:none!important} #report{display:block!important;padding:6mm} @page{size:A4;margin:14mm} }
#report{display:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>

<div id="gate"><div class="box" id="gateBox"></div></div>

<header>
  <div>
    <div class="brand">ENT<span>R</span>IX</div>
    <div class="sub">Installation Expenses</div>
  </div>
  <div class="whoami"><b id="whoName">—</b><span><i class="sync" id="syncDot"></i><span id="syncTxt">…</span></span></div>
</header>

<main>
  <section class="view active" id="v-sites">
    <div id="cfgBanner"></div>
    <div id="siteList"></div>
    <div id="ownerAdd"></div>
  </section>

  <section class="view" id="v-detail">
    <button class="btn ghost sm mini" id="backBtn" style="margin-bottom:12px">← All sites</button>
    <div id="detailHead"></div>
    <div id="detailForm"></div>
    <div class="eyebrow" id="entryHead">Payments to contractor</div>
    <div class="card" id="entryList"></div>
    <div id="reportBtnWrap"></div>
  </section>

  <section class="view" id="v-edit">
    <button class="btn ghost sm mini" id="editBack" style="margin-bottom:12px">← Back</button>
    <div id="editForm"></div>
  </section>

  <section class="view" id="v-people"></section>
</main>

<nav>
  <button data-go="sites" class="on"><span class="ic">▦</span>Sites</button>
  <button data-go="people" id="peopleTab"><span class="ic">👤</span>People</button>
  <button data-go="lock"><span class="ic">⎋</span>Lock</button>
</nav>

<div id="report"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ═══════════ 1. SETTINGS ═══════════ */
const OWNER_PIN = '9999';   // your PIN — change this

const firebaseConfig = {
  apiKey: "AIzaSyCIoj0grG9a-wwvBQKL6rffl3d4SQHVm5o",
  authDomain: "project-site-expenses.firebaseapp.com",
  projectId: "project-site-expenses",
  storageBucket: "project-site-expenses.firebasestorage.app",
  messagingSenderId: "603747323761",
  appId: "1:603747323761:web:4b1c97f158c2dcd33ab0d0"
};

/* ═══════════ 2. Firebase ═══════════ */
let db=null, LIVE=false, SITES=[], PAYS=[], PEOPLE=[];

async function initDB(){
  if(!firebaseConfig.apiKey){ demo(); return; }
  try{
    const [{initializeApp},fs,auth] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js')
    ]);
    const app=initializeApp(firebaseConfig);
    db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})});
    window.FS=fs; LIVE=true;
    try{ await auth.signInAnonymously(auth.getAuth(app)); }catch(e){ banner('Enable Anonymous sign-in in Firebase → Authentication.'); }

    fs.onSnapshot(fs.query(fs.collection(db,'jobs'), fs.orderBy('name')), s=>{
      SITES=s.docs.map(d=>({id:d.id,...d.data()})); render();
    }, e=>dbErr(e));
    fs.onSnapshot(fs.query(fs.collection(db,'people'), fs.orderBy('name')), s=>{
      PEOPLE=s.docs.map(d=>({id:d.id,...d.data()})); renderGate(); render();
    }, e=>dbErr(e));
    fs.onSnapshot(fs.query(fs.collection(db,'payments'), fs.orderBy('date','desc'), fs.limit(3000)), s=>{
      PAYS=s.docs.map(d=>({id:d.id,...d.data()}));
      sync(s.metadata.fromCache?'cache':'live'); render();
    }, e=>dbErr(e));
  }catch(e){ banner('Could not reach Firebase: '+e.message); sync('err'); }
}
function dbErr(e){ sync('err'); if(e.code==='permission-denied') banner('Publish the Firestore security rules, then reload.'); }
function sync(st){ const d=$('syncDot'),t=$('syncTxt');
  d.className='sync'+(st==='live'?' on':(st==='cache'||st==='demo')?' off':'');
  t.textContent=st==='live'?'synced':st==='cache'?'offline':st==='demo'?'demo':'not connected'; }
function banner(m){ $('cfgBanner').innerHTML='<div class="banner">'+m+'</div>'; }
function demo(){ SITES=[]; PAYS=[]; PEOPLE=[]; sync('demo'); banner('<b>Demo mode.</b> Add your Firebase config to save data.'); render(); renderGate(); }

/* ═══════════ 3. State + helpers ═══════════ */
let ME={name:'',role:'owner'}, openId=null, conKind='expense', admKind='payment';
const $=id=>document.getElementById(id);
const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const today=()=>new Date().toISOString().slice(0,10);
const dmy=s=>{const p=String(s).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:s;};
const site=id=>SITES.find(x=>x.id===id)||{};
const isOwner=()=>ME.role==='owner';
const isCon=()=>ME.role==='contractor';
function toast(m,bad){const t=$('toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');setTimeout(()=>t.className='toast'+(bad?' bad':''),2400);}

function calc(id){
  const s=site(id);
  const perPole = s.basis==='pole';
  const poles   = Number(s.poles)||0;
  const cRate   = Number(s.clientRate)||0;   // our rate/pole from client
  const yRate   = Number(s.contractorRate)||0; // contractor rate/pole
  const client  = perPole ? cRate*poles : (Number(s.clientAmount)||0);       // X
  const contract= perPole ? yRate*poles : (Number(s.contractorAmount)||0);   // Y

  const rows=PAYS.filter(p=>p.siteId===id);
  const paid=rows.filter(p=>p.type==='payment').reduce((a,b)=>a+(Number(b.amount)||0),0); // paid to contractor
  const conExp=rows.filter(p=>p.type==='expense').reduce((a,b)=>a+(Number(b.amount)||0),0); // contractor's own spend
  const ourExp=rows.filter(p=>p.type==='ourexp').reduce((a,b)=>a+(Number(b.amount)||0),0); // company transport & other

  return {perPole, poles, cRate, yRate, client, contract, paid, conExp, ourExp,
          balance:contract-paid,               // owed to contractor
          profit:client-contract-ourExp,       // OUR margin = X − Y − our direct costs
          conProfit:contract-conExp,           // his margin
          count:rows.length};
}

/* ═══════════ 4. Login ═══════════ */
function renderGate(){
  if($('gate').style.display==='none') return;
  const cons=PEOPLE.filter(p=>p.role==='contractor');
  $('gateBox').innerHTML=`
    <div class="logo">ENT<span>R</span>IX</div>
    <div class="tag">Installation Expenses</div>
    <button class="who" data-name="Admin" data-role="owner" data-pin="${OWNER_PIN}">
      <span class="ic">📊</span><span><b>Admin</b><span>Full access — profit, expenses &amp; all sites</span></span><span class="ch">›</span></button>
    ${cons.map(p=>`<button class="who" data-name="${p.name}" data-role="contractor" data-pin="${p.pin||''}">
      <span class="ic">🏗️</span><span><b>${p.name}</b><span>Contractor — own work only</span></span><span class="ch">›</span></button>`).join('')}
    ${cons.length?'':'<div class="foot">Sign in as Admin to add contractors.</div>'}
    <div class="foot">ENTRIX Innovation · Nagpur</div>`;
  $('gateBox').querySelectorAll('.who').forEach(b=>b.onclick=()=>askPin(b.dataset.name,b.dataset.role,b.dataset.pin));
}
function askPin(name,role,pin){
  $('gateBox').innerHTML=`
    <button class="back" id="gBack">← Back</button>
    <div class="logo">ENT<span>R</span>IX</div>
    <div class="tag">${name}</div>
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
    <div class="err" id="pinErr"></div>
    <button class="btn" id="pinGo">Open</button>`;
  const need=role==='owner'?OWNER_PIN:(pin||'');
  const g=()=>{ const v=$('pin').value.trim(); if(v && v===need){ ME={name,role}; unlock(); }
               else { $('pinErr').textContent=need?'Wrong PIN':'No PIN set — ask the owner'; $('pin').value=''; } };
  $('pinGo').onclick=g; $('pin').addEventListener('keydown',e=>{if(e.key==='Enter')g();});
  $('gBack').onclick=renderGate; $('pin').focus();
}
function unlock(){ $('gate').style.display='none'; $('whoName').textContent=ME.name;

  $('peopleTab').style.display=isOwner()?'':'none'; render(); go('sites'); }

/* ═══════════ 5. Navigation ═══════════ */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>b.dataset.go==='lock'?location.reload():go(b.dataset.go));
function go(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('v-'+name).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===name));
  if(name==='people') renderPeople();
  window.scrollTo(0,0);
}
$('backBtn').onclick=()=>go('sites');
$('editBack').onclick=()=>{ openId?showDetail(openId):go('sites'); };

/* ═══════════ 6. Sites list ═══════════ */
function mySites(){ return isCon()?SITES.filter(x=>(x.contractor||'').toLowerCase()===(ME.name||'').toLowerCase()):SITES; }
function renderSites(){
  const list=mySites();
  $('ownerAdd').innerHTML=isOwner()?'<button class="btn dark" id="addSiteBtn">+ Add a site</button>':'';
  if(isOwner()) $('addSiteBtn').onclick=()=>{ openId=null; showEdit(); };
  if(!list.length){ $('siteList').innerHTML='<div class="empty"><b>No sites yet</b>'+(isOwner()?'Add your first site.':'Nothing assigned to you.')+'</div>'; return; }
  $('siteList').innerHTML=list.map(s=>{
    const c=calc(s.id);
    const right=isOwner()
      ? `<div style="text-align:right"><div class="num big ${c.profit>=0?'pos':'neg'}">${money(c.profit)}</div><small>profit</small></div>`
      : `<div style="text-align:right"><div class="num big ${c.balance>0?'neg':'pos'}">${money(c.balance)}</div><small>balance to you</small></div>`;
    return `<button class="site" data-id="${s.id}">
      <h3>${s.name}</h3>
      <div class="meta">${[s.client, s.contractor?'◆ '+s.contractor:''].filter(Boolean).join(' · ')}</div>
      <div class="figs">
        <div><div class="num big">${money(c.contract)}</div><small>${isOwner()?'contractor rate (Y)':'your contract'}</small></div>
        ${right}
      </div>
    </button>`;
  }).join('');
  $('siteList').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>showDetail(b.dataset.id));
}

/* ═══════════ 7. One site ═══════════ */
function showDetail(id){ openId=id; go('detail'); renderDetail(); }
function renderDetail(){
  const s=site(openId), c=calc(openId), cls=c.profit>=0?'win':'lose';
  $('detailHead').innerHTML=isOwner()?`
    <div class="grand ${cls}">
      <div class="k">${s.name} — net profit</div>
      <div class="v num ${c.profit>=0?'g':'r'}">${money(c.profit)}</div>
      <div class="split">
        <div>Client (X)${c.perPole?` · ${c.poles}×${money(c.cRate)}`:''}<b class="num">${money(c.client)}</b></div>
        <div>Contractor (Y)${c.perPole?` · ${c.poles}×${money(c.yRate)}`:''}<b class="num">${money(c.contract)}</b></div>
        ${c.ourExp?`<div>Our expenses<b class="num">${money(c.ourExp)}</b></div>`:''}
      </div>
    </div>
    <div class="card">
      <div class="tot"><span>Contractor</span><b>${s.contractor||'—'}</b></div>
      <div class="tot"><span>Contract amount (Y)</span><b class="num">${money(c.contract)}</b></div>
      <div class="tot"><span>Advance / part paid</span><b class="num">${money(c.paid)}</b></div>
      <div class="tot"><span><b>Balance to pay him</b></span><b class="num ${c.balance>0?'neg':'pos'}">${money(c.balance)}</b></div>
    </div>
    <div class="card">
      <div class="tot"><span><b>Company profit on this site</b></span><b></b></div>
      <div class="tot"><span>Contract from client (X)</span><b class="num">${money(c.client)}</b></div>
      <div class="tot"><span>Given to contractor (Y)</span><b class="num">${money(c.contract)}</b></div>
      <div class="tot"><span>Our transport &amp; other expenses</span><b class="num">${money(c.ourExp)}</b></div>
      <div class="tot"><span><b>Net profit</b></span><b class="num ${c.profit>=0?'pos':'neg'}">${money(c.profit)}</b></div>
    </div>
    <div class="card">
      <div class="tot"><span><b>Contractor's own account</b></span><b></b></div>
      <div class="tot"><span>Advance he took from company</span><b class="num">${money(c.paid)}</b></div>
      <div class="tot"><span>His expenses logged</span><b class="num">${money(c.exp)}</b></div>
      <div class="tot"><span>His contract (Y)</span><b class="num">${money(c.contract)}</b></div>
      <div class="tot"><span><b>His margin (Y − his expenses)</b></span><b class="num ${c.conProfit>=0?'pos':'neg'}">${money(c.conProfit)}</b></div>
    </div>
    <button class="btn ghost sm" id="editSiteBtn" style="margin-bottom:12px">Edit site</button>`
  :`
    <div class="grand">
      <div class="k">${s.name}</div>
      <div class="v num ${c.balance>0?'r':'g'}">${money(c.balance)}</div>
      <div class="k" style="color:#9FB0CC">balance still to receive from company</div>
      <div class="split">
        <div>Your contract<b class="num">${money(c.contract)}</b></div>
        <div>Advance taken<b class="num">${money(c.paid)}</b></div>
        <div>Your expenses<b class="num">${money(c.exp)}</b></div>
      </div>
    </div>`;
  if(isOwner() && $('editSiteBtn')) $('editSiteBtn').onclick=()=>showEdit();

  $('detailForm').innerHTML=isCon()?`
    <div class="seg" id="conSeg">
      <button data-t="expense" class="on">My expense</button>
      <button data-t="advance">Advance taken</button>
    </div>
    <div class="card">
      <div class="field"><label for="pAmt">Amount</label>
        <div class="rupee"><span class="c">₹</span><input id="pAmt" type="tel" inputmode="decimal" placeholder="0"></div></div>
      <div class="row">
        <div class="field"><label for="pDate">Date</label><input id="pDate" type="date" value="${today()}"></div>
        <div class="field"><label for="pMode">Mode</label>
          <select id="pMode"><option>Cash</option><option>UPI</option><option>Bank transfer</option></select></div>
      </div>
      <div class="field"><label for="pNote">Remark</label><input id="pNote" placeholder="e.g. labour, transport, material"></div>
      <button class="btn" id="payBtn">Save</button>
    </div>`
  :`
    <div class="seg" id="admSeg">
      <button data-t="payment" class="on">Pay contractor</button>
      <button data-t="ourexp">Company expense</button>
    </div>
    <div class="card">
      <div class="field"><label for="pAmt">Amount</label>
        <div class="rupee"><span class="c">₹</span><input id="pAmt" type="tel" inputmode="decimal" placeholder="0"></div></div>
      <div class="row">
        <div class="field"><label for="pDate">Date</label><input id="pDate" type="date" value="${today()}"></div>
        <div class="field"><label for="pMode">Mode</label>
          <select id="pMode"><option>Cash</option><option>UPI</option><option>Bank transfer</option></select></div>
      </div>
      <div class="field"><label for="pNote" id="pNoteLbl">Remark</label><input id="pNote" placeholder="e.g. advance, poles done, final"></div>
      <button class="btn" id="payBtn">Save</button>
    </div>`;
  conKind='expense'; admKind='payment';
  if(isCon()){
    document.querySelectorAll('#conSeg button').forEach(b=>b.onclick=()=>{
      conKind=b.dataset.t;
      document.querySelectorAll('#conSeg button').forEach(x=>x.classList.toggle('on',x===b));
      $('pNote').placeholder = conKind==='advance'?'e.g. advance from office':'e.g. labour, transport, material';
    });
  } else {
    document.querySelectorAll('#admSeg button').forEach(b=>b.onclick=()=>{
      admKind=b.dataset.t;
      document.querySelectorAll('#admSeg button').forEach(x=>x.classList.toggle('on',x===b));
      $('pNoteLbl').textContent = admKind==='ourexp'?'What was it for?':'Remark';
      $('pNote').placeholder = admKind==='ourexp'?'e.g. transport, crane, food':'e.g. advance, poles done, final';
      $('payBtn').textContent = admKind==='ourexp'?'Save expense':'Save payment';
    });
  }
  $('payBtn').onclick=savePay;

  const rows=PAYS.filter(p=>p.siteId===openId);
  // contractor never sees company (ourexp) rows
  const shown = isCon() ? rows.filter(p=>p.type!=='ourexp') : rows;
  $('entryList').innerHTML=shown.length?shown.map(payRow).join(''):'<div class="empty">Nothing yet.</div>';
  bindDel();
  $('entryHead').textContent = isCon()?'My expenses & advances':'All entries — payments, advances & his expenses';
  $('reportBtnWrap').innerHTML = isOwner()
    ? `<button class="btn dark" id="projBtn">Project statement (PDF)</button>
       <button class="btn ghost" id="stmtBtn" style="margin-top:9px">Contractor statement (PDF)</button>`
    : `<button class="btn ghost" id="stmtBtn">Download my statement</button>`;
  if($('projBtn')) $('projBtn').onclick=()=>projectStatement(openId);
  $('stmtBtn').onclick=()=>statement(openId);
}
function payRow(p){
  const tag = p.type==='expense'?'His expense' : p.type==='advance'?'Advance taken' : p.type==='ourexp'?'Company expense' : 'Payment';
  const canDel = isOwner() || (isCon() && p.by===ME.name);
  return `<div class="ent"><div class="body">
    <div class="t1">${money(p.amount)} <span style="font-weight:500;color:var(--muted);font-size:12px">· ${tag}${p.mode?' · '+p.mode:''}</span></div>
    <div class="t2">${[dmy(p.date),p.note,p.by].filter(Boolean).join(' · ')}</div>
    ${canDel?`<button class="del" data-del="${p.id}">Delete</button>`:''}
  </div><div class="amt num">${money(p.amount)}</div></div>`;
}
function bindDel(){
  $('entryList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Tap to confirm'; b.classList.add('armed');
      setTimeout(()=>{if(b.isConnected){b.dataset.armed='0';b.textContent='Delete';b.classList.remove('armed');}},4000); return; }
    if(LIVE) await window.FS.deleteDoc(window.FS.doc(db,'payments',b.dataset.del));
    else { PAYS=PAYS.filter(x=>x.id!==b.dataset.del); render(); }
    toast('Deleted');
  });
}
async function savePay(){
  const amt=parseFloat($('pAmt').value);
  if(!(amt>0)) return toast('Enter an amount',true);
  // owner records a payment TO the contractor; contractor records his own expense or an advance he took
  const type = isCon() ? conKind : admKind;
  const rec={ siteId:openId, type, amount:Math.round(amt*100)/100, date:$('pDate').value||today(),
              mode:$('pMode').value, note:$('pNote').value.trim(), by:ME.name, createdAt:Date.now() };
  $('payBtn').disabled=true;
  try{
    if(LIVE) await window.FS.addDoc(window.FS.collection(db,'payments'),rec);
    else { PAYS.unshift({id:'p'+Date.now(),...rec}); render(); }
    $('pAmt').value=''; $('pNote').value=''; toast('Payment saved — '+money(rec.amount));
  }catch(e){ toast('Could not save: '+e.message,true); }
  $('payBtn').disabled=false;
}

/* ═══════════ 8. Add / edit site ═══════════ */
function showEdit(){ go('edit'); renderEdit(); }
function renderEdit(){
  const s=openId?site(openId):{};
  const cons=PEOPLE.filter(p=>p.role==='contractor').map(p=>`<option value="${p.name}"></option>`).join('');
  $('editForm').innerHTML=`
    <div class="eyebrow">${openId?'Edit site':'New site'}</div>
    <div class="card">
      <div class="field"><label for="eName">Site name</label><input id="eName" value="${s.name||''}" placeholder="e.g. Wani 68 pole grouting"></div>
      <div class="field"><label for="eClient">Client</label><input id="eClient" value="${s.client||''}" placeholder="Client name"></div>

      <div class="field"><label for="eBasis">Contract type</label>
        <select id="eBasis">
          <option value="lump"${s.basis==='pole'?'':' selected'}>Lump sum</option>
          <option value="pole"${s.basis==='pole'?' selected':''}>Pole wise (rate × poles)</option>
        </select></div>

      <div class="field"><label for="eCon">Contractor</label>
        <input id="eCon" list="conList" value="${s.contractor||''}" placeholder="e.g. Makarand Installation" autocomplete="off">
        <datalist id="conList">${cons}</datalist></div>

      <div id="lumpBox" style="display:${s.basis==='pole'?'none':'block'}">
        <div class="field"><label for="eX">Contract from client (X)</label>
          <div class="rupee"><span class="c">₹</span><input id="eX" type="tel" inputmode="decimal" value="${s.clientAmount||''}" placeholder="0"></div></div>
        <div class="field"><label for="eY">Contract given to contractor (Y)</label>
          <div class="rupee"><span class="c">₹</span><input id="eY" type="tel" inputmode="decimal" value="${s.contractorAmount||''}" placeholder="0"></div></div>
      </div>

      <div id="poleBox" style="display:${s.basis==='pole'?'block':'none'}">
        <div class="field"><label for="ePoles">Number of poles</label><input id="ePoles" type="tel" inputmode="numeric" value="${s.poles||''}" placeholder="0"></div>
        <div class="row">
          <div class="field"><label for="eCR">Client rate / pole</label>
            <div class="rupee"><span class="c">₹</span><input id="eCR" type="tel" inputmode="decimal" value="${s.clientRate||''}" placeholder="1000"></div></div>
          <div class="field"><label for="eYR">Contractor rate / pole</label>
            <div class="rupee"><span class="c">₹</span><input id="eYR" type="tel" inputmode="decimal" value="${s.contractorRate||''}" placeholder="700"></div></div>
        </div>
      </div>

      <div class="hint" id="eCalc"></div>
      <button class="btn" id="eSave" style="margin-top:13px">${openId?'Update site':'Save site'}</button>
      ${openId?'<button class="btn danger sm" id="eDel" style="margin-top:9px">Delete site</button>':''}
    </div>`;
  const upd=()=>{
    const pole=$('eBasis').value==='pole';
    $('lumpBox').style.display=pole?'none':'block';
    $('poleBox').style.display=pole?'block':'none';
    let x,y,extra='';
    if(pole){
      const n=parseFloat($('ePoles').value)||0, cr=parseFloat($('eCR').value)||0, yr=parseFloat($('eYR').value)||0;
      x=cr*n; y=yr*n;
      if(n&&cr) extra=` &nbsp;·&nbsp; ${money(x)} = ${money(cr)} × ${n}`;
    } else { x=parseFloat($('eX').value)||0; y=parseFloat($('eY').value)||0; }
    $('eCalc').innerHTML=(x||y)?`Gross profit (X − Y): <b>${money(x-y)}</b>${extra}<br><span style="color:var(--muted)">Company transport &amp; other costs are logged on the site and reduce this.</span>`:'';
  };
  ['eBasis','eX','eY','ePoles','eCR','eYR'].forEach(id=>$(id)&&$(id).addEventListener('input',upd));
  $('eBasis').addEventListener('change',upd); upd();

  $('eSave').onclick=async()=>{
    const pole=$('eBasis').value==='pole';
    const n=Math.round(parseFloat($('ePoles').value)||0);
    const cr=Math.round(parseFloat($('eCR').value)||0);
    const yr=Math.round(parseFloat($('eYR').value)||0);
    const rec={ name:$('eName').value.trim(), client:$('eClient').value.trim(),
      contractor:$('eCon').value.trim(),
      basis: pole?'pole':'lump',
      poles: pole?n:0, clientRate: pole?cr:0, contractorRate: pole?yr:0,
      clientAmount: pole? cr*n : Math.round(parseFloat($('eX').value)||0),
      contractorAmount: pole? yr*n : Math.round(parseFloat($('eY').value)||0) };
    if(!rec.name) return toast('Enter a site name',true);
    try{
      if(rec.contractor && !PEOPLE.some(p=>p.name.toLowerCase()===rec.contractor.toLowerCase())){
        if(LIVE) await window.FS.addDoc(window.FS.collection(db,'people'),{name:rec.contractor,role:'contractor',pin:''});
        else PEOPLE.push({id:'x'+Date.now(),name:rec.contractor,role:'contractor',pin:''});
      }
      if(LIVE){ if(openId) await window.FS.updateDoc(window.FS.doc(db,'jobs',openId),rec);
                else { const r=await window.FS.addDoc(window.FS.collection(db,'jobs'),{...rec,createdAt:Date.now()}); openId=r.id; } }
      else { if(openId) Object.assign(site(openId),rec); else { openId='s'+Date.now(); SITES.push({id:openId,...rec}); } }
      toast('Site saved'); render(); showDetail(openId);
    }catch(e){ toast('Could not save: '+e.message,true); }
  };
  if(openId) $('eDel').onclick=async()=>{
    const b=$('eDel');
    if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Tap again to delete'; b.classList.add('armed');
      setTimeout(()=>{if(b.isConnected){b.dataset.armed='0';b.textContent='Delete site';b.classList.remove('armed');}},4000); return; }
    if(LIVE) await window.FS.deleteDoc(window.FS.doc(db,'jobs',openId));
    else SITES=SITES.filter(x=>x.id!==openId);
    openId=null; toast('Site deleted'); render(); go('sites');
  };
}

/* ═══════════ 9. People (owner) ═══════════ */
function renderPeople(){
  if(!isOwner()){ $('v-people').innerHTML=''; return; }
  $('v-people').innerHTML=`<div class="eyebrow">Contractors who can open the app</div><div class="card" id="peopleCard"></div>`;
  const list=PEOPLE.filter(p=>p.role==='contractor');
  $('peopleCard').innerHTML=(list.length?'':'<div class="empty" style="padding:12px 4px">None yet.</div>')
    + list.map(p=>`
      <div class="field" style="display:grid;grid-template-columns:1fr 74px;gap:8px;align-items:end;margin-bottom:8px">
        <div><label>Name</label><input class="pn" data-id="${p.id}" value="${p.name}"></div>
        <div><label>PIN</label><input class="pp" data-id="${p.id}" type="tel" inputmode="numeric" maxlength="4" value="${p.pin||''}" placeholder="----" style="text-align:center;letter-spacing:.15em;font-weight:800"></div>
      </div>
      <div style="display:flex;gap:7px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)">
        <button class="btn ghost sm mini" data-save="${p.id}">Save</button>
        <button class="btn danger sm mini" data-rm="${p.id}">Remove</button>
      </div>`).join('')
    + `<div class="field" style="margin-top:6px"><label for="npName">Add a contractor</label><input id="npName" placeholder="Name"></div>
       <div class="field"><label for="npPin">4-digit PIN</label><input id="npPin" type="tel" inputmode="numeric" maxlength="4" placeholder="e.g. 1234" style="text-align:center;letter-spacing:.15em;font-weight:800"></div>
       <button class="btn ghost sm" id="npAdd">Add contractor</button>
       <div class="hint">Each contractor logs in with his own PIN and sees only his sites, his contract amount, payments received and balance — never your client amount or profit.</div>`;
  $('npAdd').onclick=async()=>{
    const n=$('npName').value.trim(),pin=$('npPin').value.trim();
    if(!n) return toast('Type a name',true);
    if(!/^\d{4}$/.test(pin)) return toast('PIN must be 4 digits',true);
    if(LIVE) await window.FS.addDoc(window.FS.collection(db,'people'),{name:n,role:'contractor',pin});
    else { PEOPLE.push({id:'x'+Date.now(),name:n,role:'contractor',pin}); renderPeople(); renderGate(); }
    toast(`${n} added · PIN ${pin}`);
  };
  $('peopleCard').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.save;
    const name=$('peopleCard').querySelector(`.pn[data-id="${id}"]`).value.trim();
    const pin=$('peopleCard').querySelector(`.pp[data-id="${id}"]`).value.trim();
    if(!name) return toast('Name cannot be blank',true);
    if(pin && !/^\d{4}$/.test(pin)) return toast('PIN must be 4 digits',true);
    const rec=PEOPLE.find(x=>x.id===id),old=rec?rec.name:name,hit=SITES.filter(x=>x.contractor===old);
    if(LIVE){ await window.FS.updateDoc(window.FS.doc(db,'people',id),{name,pin});
      for(const x of hit) await window.FS.updateDoc(window.FS.doc(db,'jobs',x.id),{contractor:name}); }
    else { if(rec){rec.name=name;rec.pin=pin;} hit.forEach(x=>x.contractor=name); render(); renderGate(); }
    toast('Saved'+(hit.length?` · ${hit.length} site(s) updated`:''));
  });
  $('peopleCard').querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Tap to confirm'; b.classList.add('armed');
      setTimeout(()=>{if(b.isConnected){b.dataset.armed='0';b.textContent='Remove';b.classList.remove('armed');}},4000); return; }
    if(LIVE) await window.FS.deleteDoc(window.FS.doc(db,'people',b.dataset.rm));
    else { PEOPLE=PEOPLE.filter(x=>x.id!==b.dataset.rm); renderPeople(); renderGate(); }
    toast('Removed');
  });
}

/* ═══════════ 10. Contractor statement (PDF) ═══════════ */
function projectStatement(id){
  const s=site(id), c=calc(id);
  const rows=PAYS.filter(p=>p.siteId===id).slice().sort((a,b)=> a.date<b.date?-1:1);
  const pays=rows.filter(p=>p.type==='payment');
  const our =rows.filter(p=>p.type==='ourexp');
  const line = (label,val,bold)=>`<tr><td style="padding:6px 0${bold?';border-top:1.5px solid #0A1F44;font-weight:800':''}">${label}</td><td style="padding:6px 0${bold?';border-top:1.5px solid #0A1F44;font-weight:800':''};text-align:right">${money(val)}</td></tr>`;
  const tbl = (title,list,cols)=>`
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#0A1F44;margin:16px 0 6px">${title}</div>
    <table style="width:100%;border-collapse:collapse;font-size:11px">
      <tr style="background:#0A1F44;color:#fff"><th style="text-align:left;padding:5px 6px">Date</th><th style="text-align:left;padding:5px 6px">Detail</th><th style="text-align:left;padding:5px 6px">Mode</th><th style="text-align:right;padding:5px 6px">Amount</th></tr>
      ${list.length?list.map(p=>`<tr><td style="padding:4px 6px;border-bottom:1px solid #ddd">${dmy(p.date)}</td><td style="padding:4px 6px;border-bottom:1px solid #ddd">${p.note||'—'}</td><td style="padding:4px 6px;border-bottom:1px solid #ddd">${p.mode||''}</td><td style="padding:4px 6px;border-bottom:1px solid #ddd;text-align:right">${money(p.amount)}</td></tr>`).join(''):'<tr><td colspan="4" style="padding:6px;color:#666">None.</td></tr>'}
      <tr><td colspan="3" style="padding:6px;font-weight:800;border-top:1.5px solid #0A1F44">Total</td><td style="padding:6px;text-align:right;font-weight:800;border-top:1.5px solid #0A1F44">${money(list.reduce((a,b)=>a+b.amount,0))}</td></tr>
    </table>`;

  $('report').innerHTML=`
    <div style="border-bottom:2px solid #0A1F44;padding-bottom:8px;margin-bottom:14px">
      <div style="font-size:19px;font-weight:800;letter-spacing:.16em;color:#0A1F44">ENTRIX INNOVATION</div>
      <div style="font-size:13px;font-weight:700;margin-top:4px">Project Statement — ${s.name}</div>
      <div style="font-size:10px;color:#555;margin-top:2px">${[s.client, s.contractor?'Contractor: '+s.contractor:''].filter(Boolean).join(' · ')} · Nagpur · entrix.co.in · ${dmy(today())}</div>
    </div>

    <table style="width:100%;border-collapse:collapse;font-size:12px">
      ${c.perPole?line(`Poles × client rate  (${c.poles} × ${money(c.cRate)})`, c.client):''}
      ${line('Contract from client (X)', c.client)}
      ${c.perPole?line(`Poles × contractor rate  (${c.poles} × ${money(c.yRate)})`, c.contract):''}
      ${line('Given to contractor (Y)', c.contract)}
      ${line('Company transport & other expenses', c.ourExp)}
      ${line('Net profit', c.profit, true)}
    </table>

    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:14px">
      ${line('Paid to contractor so far', c.paid)}
      ${line('Balance payable to contractor', c.balance, true)}
    </table>

    ${tbl('Payments to contractor', pays)}
    ${tbl('Company transport & other expenses', our)}

    <div style="margin-top:26px;font-size:10px;color:#666;border-top:1px solid #bbb;padding-top:7px">
      ENTRIX Innovation, Nagpur · entrix.co.in · Prepared by ${ME.name}
    </div>`;
  setTimeout(()=>window.print(),120);
}

function statement(id){
  const s=site(id),c=calc(id);
  const rows=PAYS.filter(p=>p.siteId===id).slice().sort((a,b)=>a.date<b.date?-1:1);
  $('report').innerHTML=`
    <div style="border-bottom:2px solid #0A1F44;padding-bottom:8px;margin-bottom:14px">
      <div style="font-size:19px;font-weight:800;letter-spacing:.16em;color:#0A1F44">ENTRIX INNOVATION</div>
      <div style="font-size:13px;font-weight:700;margin-top:4px">Contractor Statement — ${s.contractor||''}</div>
      <div style="font-size:10px;color:#555;margin-top:2px">${s.name} · Nagpur · entrix.co.in · ${dmy(today())}</div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px">
      <tr><td style="padding:5px 0">Contract amount</td><td style="text-align:right;font-weight:800">${money(c.contract)}</td></tr>
      <tr><td style="padding:5px 0">Total received</td><td style="text-align:right;font-weight:800">${money(c.paid)}</td></tr>
      <tr><td style="padding:7px 0;border-top:1.5px solid #0A1F44"><b>Balance payable</b></td><td style="text-align:right;font-weight:800;border-top:1.5px solid #0A1F44">${money(c.balance)}</td></tr>
    </table>
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#0A1F44;margin-bottom:6px">Payments received</div>
    <table style="width:100%;border-collapse:collapse;font-size:11px">
      <tr style="background:#0A1F44;color:#fff"><th style="text-align:left;padding:5px 6px">Date</th><th style="text-align:left;padding:5px 6px">Mode</th><th style="text-align:left;padding:5px 6px">Remark</th><th style="text-align:right;padding:5px 6px">Amount</th></tr>
      ${rows.length?rows.map(p=>`<tr><td style="padding:4px 6px;border-bottom:1px solid #ddd">${dmy(p.date)}</td><td style="padding:4px 6px;border-bottom:1px solid #ddd">${p.mode||''}</td><td style="padding:4px 6px;border-bottom:1px solid #ddd">${p.note||''}</td><td style="padding:4px 6px;border-bottom:1px solid #ddd;text-align:right">${money(p.amount)}</td></tr>`).join(''):'<tr><td colspan="4" style="padding:6px;color:#666">No payments yet.</td></tr>'}
      <tr><td colspan="3" style="padding:7px 6px;font-weight:800;border-top:1.5px solid #0A1F44">Total received</td><td style="padding:7px 6px;text-align:right;font-weight:800;border-top:1.5px solid #0A1F44">${money(c.paid)}</td></tr>
    </table>
    <div style="margin-top:28px;display:flex;justify-content:space-between;font-size:10px">
      <div>Received &amp; found correct<br><br><br>____________________<br>${s.contractor||'Contractor'}</div>
      <div style="text-align:right">For ENTRIX Innovation<br><br><br>____________________<br>Authorised signatory</div>
    </div>`;
  setTimeout(()=>window.print(),120);
}

/* ═══════════ 11. Boot ═══════════ */
function render(){ renderSites();
  if($('v-detail').classList.contains('active')&&openId) renderDetail();
  if($('v-people').classList.contains('active')) renderPeople(); }
renderGate(); initDB();
</script>
</body>
